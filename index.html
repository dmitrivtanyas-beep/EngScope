<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngSpace - Парний простір для вивчення англійської</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">
    <div id="root"></div>

    <!-- Firebase SDKs (v10 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Конфігурація Firebase з вашого проєкту
        const firebaseConfig = {
          apiKey: "AIzaSyBtohoKon-Q9CB0qXoa6XlufqcsRpYFPho",
          authDomain: "engscope-7ae3c.firebaseapp.com",
          projectId: "engscope-7ae3c",
          storageBucket: "engscope-7ae3c.firebasestorage.app",
          messagingSenderId: "602537995169",
          appId: "1:602537995169:web:e3cc995338dd50dfa9f9e0",
          measurementId: "G-TVD7HHYZ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "engspace-main-space";

        window.firebaseApp = { auth, db, appId, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc, getDoc };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Іконки ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const paths = {
                book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
                pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
                brain: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>',
                settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
                columns: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="3" y2="21"/>',
                splitClose: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/><path d="m14 9-3 3 3 3"/>',
                search: '<circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/>',
                plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
                trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
                save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
                info: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>',
                check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
                users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
                logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
                user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths[name] || '' }} />;
        };

        const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);
            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            const [workspaces, setWorkspaces] = useState([]);
            const [activeWorkspace, setActiveWorkspace] = useState(null);

            const [words, setWords] = useState([]);
            const [publicNotes, setPublicNotes] = useState([]);
            const [privateNotes, setPrivateNotes] = useState([]);

            const [activeTab, setActiveTab] = useState('dictionary');
            const [isSplitScreen, setIsSplitScreen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const toastTimeoutRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3000);
            };

            // Підключення до Firebase після завантаження модуля
            useEffect(() => {
                const handleReady = () => {
                    if (window.firebaseApp) {
                        setFb(window.firebaseApp);
                        const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                        return () => unsubscribe();
                    }
                };
                if (window.firebaseApp) handleReady();
                window.addEventListener('firebase-ready', handleReady);
            }, []);

            const loginWithGoogle = async () => {
                if (!fb) return;
                try {
                    const provider = new fb.GoogleAuthProvider();
                    await fb.signInWithPopup(fb.auth, provider);
                } catch (err) {
                    console.error("Auth error:", err);
                    showToast("Помилка входу через Google");
                }
            };

            const logout = async () => {
                if (!fb) return;
                await fb.signOut(fb.auth);
                setUser(null);
                setActiveWorkspace(null);
            };

            // Завантаження робочих просторів
            useEffect(() => {
                if (!user || !fb) return;
                const wRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                const unsub = fb.onSnapshot(wRef, (snap) => {
                    const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setWorkspaces(allWs);
                    const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
                    setActiveWorkspace(myWs || null);
                }, (err) => console.error("Workspaces error:", err));
                return () => unsub();
            }, [user, fb]);

            // Завантаження даних активної кімнати (Словник, спільні нотатки + особисті нотатки)
            useEffect(() => {
                if (!user || !activeWorkspace || !fb) return;

                // Словник кімнати
                const vRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'vocabulary');
                const unsubV = fb.onSnapshot(vRef, (snap) => {
                    setWords(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                // Спільні нотатки кімнати
                const nRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'notes');
                const unsubN = fb.onSnapshot(nRef, (snap) => {
                    setPublicNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: true })));
                });

                // Особисті нотатки користувача
                const pRef = fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                const unsubP = fb.onSnapshot(pRef, (snap) => {
                    setPrivateNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: false })));
                });

                return () => { unsubV(); unsubN(); unsubP(); };
            }, [user, activeWorkspace, fb]);

            if (authLoading) {
                return <div className="flex h-screen items-center justify-center bg-stone-50 text-stone-500 text-lg font-medium">Завантаження EngSpace...</div>;
            }

            if (!user) {
                return (
                    <div className="flex h-screen items-center justify-center bg-stone-50 p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-stone-200 max-w-md w-full text-center">
                            <div className="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg mx-auto mb-6">E</div>
                            <h1 className="text-2xl font-bold text-stone-800 mb-2">Ласкаво просимо до EngSpace</h1>
                            <p className="text-stone-500 mb-8">Парний хмарний простір для вивчення англійської мови</p>
                            <button onClick={loginWithGoogle} className="w-full flex items-center justify-center gap-3 bg-white border border-stone-300 hover:bg-stone-50 text-stone-700 py-3 px-4 rounded-xl font-medium transition-all shadow-sm">
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                                Увійти через Google
                            </button>
                        </div>
                    </div>
                );
            }

            if (!activeWorkspace) {
                return <WorkspaceSetup user={user} fb={fb} workspaces={workspaces} showToast={showToast} logout={logout} />;
            }

            return (
                <div className="flex flex-col h-screen overflow-hidden bg-stone-50">
                    <header className="flex-none flex items-center justify-between px-6 py-4 bg-white border-b border-stone-200 shadow-sm z-10">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">E</div>
                            <span className="font-semibold text-lg tracking-tight hidden sm:block">EngSpace</span>
                        </div>

                        <nav className="flex items-center gap-1 sm:gap-2 bg-stone-100 p-1 rounded-xl">
                            <NavBtn icon={<Icon name="book" />} label="Словник" active={activeTab === 'dictionary'} onClick={() => {setActiveTab('dictionary'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="pen" />} label="Нотатки" active={activeTab === 'notes'} onClick={() => {setActiveTab('notes'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="brain" />} label="Повторення" active={activeTab === 'revision'} onClick={() => {setActiveTab('revision'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="settings" />} label="Налаштування" active={activeTab === 'settings'} onClick={() => {setActiveTab('settings'); setIsSplitScreen(false);}} />
                        </nav>

                        <div className="flex items-center gap-2">
                            <button onClick={() => setIsSplitScreen(!isSplitScreen)} className={`flex items-center gap-2 px-3 py-2 rounded-lg font-medium transition-colors ${isSplitScreen ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-stone-100 text-stone-600'}`}>
                                <Icon name={isSplitScreen ? "splitClose" : "columns"} />
                                <span className="hidden md:block text-sm">{isSplitScreen ? 'Закрити спліт' : 'Спліт-екран'}</span>
                            </button>
                            <button onClick={logout} className="p-2 text-stone-400 hover:text-red-600 hover:bg-stone-100 rounded-lg transition-colors" title="Вийти">
                                <Icon name="logout" size={18} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden p-4 sm:p-6">
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'dictionary' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <DictionaryPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} showToast={showToast} />
                            </div>

                            <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'notes' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <NotesPanel user={user} fb={fb} workspaceId={activeWorkspace.id} publicNotes={publicNotes} privateNotes={privateNotes} showToast={showToast} />
                            </div>

                            {!isSplitScreen && activeTab === 'revision' && (
                                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                                    <RevisionPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} />
                                </div>
                            )}

                            {!isSplitScreen && activeTab === 'settings' && (
                                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden p-8 overflow-y-auto">
                                    <SettingsPanel user={user} fb={fb} workspace={activeWorkspace} showToast={showToast} logout={logout} />
                                </div>
                            )}
                        </div>
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-stone-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 z-50">
                            <Icon name="info" className="text-indigo-400" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all ${active ? 'bg-white text-indigo-700 shadow-sm font-medium' : 'text-stone-500 hover:text-stone-800 hover:bg-stone-200/50'}`}>
                {icon}
                <span className="hidden md:block text-sm">{label}</span>
            </button>
        );

        // --- Екран налаштування кімнати ---
        function WorkspaceSetup({ user, fb, workspaces, showToast, logout }) {
            const [joinCode, setJoinCode] = useState('');
            const [loading, setLoading] = useState(false);

            const handleCreate = async () => {
                setLoading(true);
                try {
                    const code = generateInviteCode();
                    const wsRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                    await fb.addDoc(wsRef, {
                        inviteCode: code,
                        members: [user.uid],
                        createdAt: Date.now()
                    });
                    showToast("Простір створено!");
                } catch (err) {
                    showToast("Помилка створення простору");
                }
                setLoading(false);
            };

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!joinCode.trim()) return;
                setLoading(true);
                try {
                    const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
                    if (!wsToJoin) {
                        showToast("Код не знайдено");
                    } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
                        showToast("Робочий простір вже має двох учасників");
                    } else {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', wsToJoin.id);
                        const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
                        await fb.updateDoc(wsRef, { members: updatedMembers });
                        showToast("Успішно приєднано!");
                    }
                } catch (err) {
                    showToast("Помилка приєднання");
                }
                setLoading(false);
            };

            return (
                <div className="flex h-screen items-center justify-center bg-stone-50 p-4 relative">
                    <button onClick={logout} className="absolute top-6 right-6 flex items-center gap-2 text-stone-500 hover:text-stone-800 bg-white px-4 py-2 rounded-xl border border-stone-200 shadow-sm text-sm font-medium">
                        <Icon name="logout" size={16} /> Вийти ({user.email})
                    </button>
                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-stone-200 max-w-md w-full">
                        <div className="flex justify-center mb-6">
                            <div className="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">E</div>
                        </div>
                        <h1 className="text-2xl font-bold text-center text-stone-800 mb-2">Робочий простір</h1>
                        <p className="text-center text-stone-500 mb-8 text-sm">Створіть новий простір або приєднайтеся за кодом партнера</p>

                        <button onClick={handleCreate} disabled={loading} className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-medium transition-colors mb-6 shadow-sm disabled:opacity-50">
                            <Icon name="plus" size={20} /> Створити новий простір
                        </button>

                        <div className="relative flex py-4 items-center">
                            <div className="flex-grow border-t border-stone-200"></div>
                            <span className="flex-shrink-0 mx-4 text-stone-400 text-sm">або</span>
                            <div className="flex-grow border-t border-stone-200"></div>
                        </div>

                        <form onSubmit={handleJoin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-stone-700 mb-1">Код запрошення</label>
                                <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none uppercase text-center tracking-widest text-lg font-mono" maxLength={6} />
                            </div>
                            <button type="submit" disabled={loading || !joinCode.trim()} className="w-full bg-stone-800 hover:bg-stone-900 text-white py-3 rounded-xl font-medium transition-colors disabled:opacity-50">
                                Приєднатися
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- Словник ---
        function DictionaryPanel({ user, fb, workspaceId, words, showToast }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    ...formData,
                    addedBy: user.uid,
                    createdAt: Date.now(),
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary');
                    await fb.addDoc(colRef, newWord);
                    setFormData({ en: '', uk: '', example: '' });
                    showToast("Слово збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const handleDelete = async (id) => {
                try {
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', id));
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            const filteredWords = words.filter(w => w.en.toLowerCase().includes(search.toLowerCase()) || w.uk.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="flex flex-col h-full bg-stone-50">
                    <div className="flex-none p-4 md:p-6 bg-white border-b border-stone-200">
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className="flex-1 px-4 py-2 border border-stone-200 rounded-xl outline-none focus:border-indigo-500 bg-stone-50" />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className="flex-1 px-4 py-2 border border-stone-200 rounded-xl outline-none focus:border-indigo-500 bg-stone-50" />
                                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className="px-6 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-50 flex gap-2 justify-center items-center shadow-sm">
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className="w-full px-4 py-2 border border-stone-200 rounded-xl outline-none focus:border-indigo-500 text-sm bg-stone-50" />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0">
                        <div className="p-4 flex-none border-b border-stone-200 bg-white sticky top-0">
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-stone-400"><Icon name="search" size={16} /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук у спільному словнику..." className="w-full pl-9 pr-4 py-2 bg-stone-50 border border-stone-200 rounded-xl text-sm outline-none focus:border-indigo-400" />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className="text-center text-stone-400 mt-10">Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className="group bg-white p-4 rounded-xl border border-stone-200 shadow-sm flex justify-between items-start gap-4">
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className="font-bold text-lg text-stone-900">{word.en}</span>
                                                <span className="text-indigo-600 font-medium">{word.uk}</span>
                                            </div>
                                            {word.example && <p className="text-stone-600 italic text-sm mt-1">"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className="text-stone-300 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Нотатки (Спільні та особисті) ---
        function NotesPanel({ user, fb, workspaceId, publicNotes, privateNotes, showToast }) {
            const [activeNote, setActiveNote] = useState(null);
            const [isCreating, setIsCreating] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isShared, setIsShared] = useState(true);

            const allNotes = useMemo(() => [...publicNotes, ...privateNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [publicNotes, privateNotes]);
            const filteredNotes = allNotes.filter(n => n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setIsCreating(false);
                setTitle(note.title);
                setContent(note.content);
                setIsShared(note.isShared);
            };

            const saveNote = async () => {
                if (!title.trim() && !content.trim()) return;
                const noteData = { title: title || 'Без назви', content, updatedAt: Date.now() };

                try {
                    if (activeNote) {
                        if (activeNote.isShared !== isShared) {
                            const oldPath = activeNote.isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.deleteDoc(oldPath);

                            const newCol = isShared 
                                ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                                : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                            const newDoc = await fb.addDoc(newCol, { ...noteData, createdAt: activeNote.createdAt || Date.now() });
                            setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        } else {
                            const ref = isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.updateDoc(ref, noteData);
                            setActiveNote({ ...activeNote, ...noteData });
                        }
                    } else {
                        const col = isShared 
                            ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                            : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                        const newDoc = await fb.addDoc(col, { ...noteData, createdAt: Date.now() });
                        setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        setIsCreating(false);
                    }
                    showToast("Нотатку збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const deleteNote = async (note) => {
                try {
                    const ref = note.isShared 
                        ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', note.id)
                        : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', note.id);
                    await fb.deleteDoc(ref);
                    if (activeNote?.id === note.id) {
                        setActiveNote(null);
                        setIsCreating(false);
                    }
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            return (
                <div className="flex h-full">
                    <div className={`w-full md:w-1/3 border-r border-stone-200 flex flex-col bg-stone-50 ${(activeNote || isCreating) ? 'hidden md:flex' : 'flex'}`}>
                        <div className="p-4 border-b border-stone-200">
                            <button onClick={() => { setActiveNote(null); setTitle(''); setContent(''); setIsCreating(true); }} className="w-full flex items-center justify-center gap-2 bg-white border border-stone-200 hover:border-indigo-400 py-2 rounded-xl text-sm font-medium shadow-sm transition-all">
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className="p-3 border-b border-stone-200 bg-white">
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-stone-400"><Icon name="search" size={16} /></span>
                                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className="w-full pl-9 pr-3 py-1.5 bg-stone-50 border border-stone-200 rounded-lg text-sm outline-none focus:border-indigo-400" />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3 rounded-xl cursor-pointer border transition-all ${activeNote?.id === note.id ? 'bg-indigo-50 border-indigo-200' : 'hover:bg-stone-100 border-transparent'}`}>
                                    <div className="flex items-center justify-between mb-1">
                                        <h4 className="font-medium text-stone-800 truncate pr-2">{note.title}</h4>
                                        {note.isShared ? <span title="Спільна"><Icon name="users" size={14} className="text-indigo-500" /></span> : <span title="Особиста"><span className="text-xs bg-stone-200 px-1.5 py-0.5 rounded text-stone-600">Особиста</span></span>}
                                    </div>
                                    <p className="text-xs text-stone-500 truncate">{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col bg-white ${!activeNote && !isCreating && allNotes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && !isCreating && title === '' && content === '') ? (
                            <div className="text-center text-stone-400 flex flex-col items-center gap-3">
                                <Icon name="pen" size={48} className="opacity-20" />
                                <p>Оберіть нотатку або створіть нову</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex items-center justify-between p-4 border-b border-stone-100">
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setActiveNote(null); setIsCreating(false); }} className="md:hidden text-stone-500"><Icon name="splitClose" className="rotate-180" /></button>
                                        <div className="flex bg-stone-100 p-1 rounded-lg">
                                            <button onClick={() => setIsShared(true)} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${isShared ? 'bg-white shadow-sm text-indigo-700' : 'text-stone-500'}`}>Спільна</button>
                                            <button onClick={() => setIsShared(false)} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${!isShared ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500'}`}>Особиста</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {activeNote && <button onClick={() => deleteNote(activeNote)} className="p-2 text-stone-400 hover:text-red-600 rounded-lg"><Icon name="trash" size={18} /></button>}
                                        <button onClick={saveNote} className="flex items-center gap-2 bg-stone-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-stone-900 transition-colors"><Icon name="save" size={16} /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className="text-2xl font-bold border-none outline-none mb-4 placeholder:text-stone-300" />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Почніть писати тут..." className="flex-1 w-full resize-none border-none outline-none text-stone-700 leading-relaxed" />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // --- Повторення (Картки) ---
        function RevisionPanel({ user, fb, workspaceId, words }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now).sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0) {
                    if (!currentWord || !dueWords.find(w => w.id === currentWord.id)) {
                        setCurrentWord(dueWords[0]);
                        setShowAnswer(false);
                    }
                } else {
                    setCurrentWord(null);
                }
            }, [dueWords, currentWord]);

            const handleRating = async (quality) => {
                if (!currentWord) return;
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

                try {
                    const wRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', currentWord.id);
                    await fb.updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
                    setCurrentWord(null);
                    setShowAnswer(false);
                } catch (err) {
                    console.error("Review update error", err);
                }
            };

            return (
                <div className="flex flex-col h-full relative p-6 bg-stone-50/50">
                    <h2 className="text-xl font-bold flex items-center gap-2 mb-6"><Icon name="brain" className="text-indigo-600"/> Тренування ({dueWords.length} слів)</h2>
                    <div className="flex-1 flex items-center justify-center">
                        {!currentWord ? (
                            <div className="text-center p-10 bg-white rounded-3xl border border-stone-200 shadow-sm max-w-sm w-full">
                                <div className="text-green-500 flex justify-center mb-4"><Icon name="check" size={48}/></div>
                                <h3 className="text-2xl font-bold mb-2 text-stone-800">Відмінно!</h3>
                                <p className="text-stone-500">Всі слова на сьогодні повторені.</p>
                            </div>
                        ) : (
                            <div className="w-full max-w-xl bg-white rounded-3xl border border-stone-200 p-10 text-center shadow-lg">
                                <h2 className="text-5xl font-bold mb-8 text-stone-900">{currentWord.en}</h2>
                                {!showAnswer ? (
                                    <button onClick={() => setShowAnswer(true)} className="w-full py-4 bg-stone-100 rounded-xl font-semibold hover:bg-stone-200 transition-colors">Показати переклад</button>
                                ) : (
                                    <div className="border-t border-stone-100 pt-8 animate-in fade-in">
                                        <h3 className="text-3xl font-bold text-indigo-700 mb-6">{currentWord.uk}</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            <button onClick={() => handleRating(0)} className="py-2.5 bg-red-100 text-red-700 rounded-xl font-medium hover:bg-red-200 transition-colors">Забув/ла</button>
                                            <button onClick={() => handleRating(3)} className="py-2.5 bg-orange-100 text-orange-700 rounded-xl font-medium hover:bg-orange-200 transition-colors">Важко</button>
                                            <button onClick={() => handleRating(4)} className="py-2.5 bg-blue-100 text-blue-700 rounded-xl font-medium hover:bg-blue-200 transition-colors">Добре</button>
                                            <button onClick={() => handleRating(5)} className="py-2.5 bg-green-100 text-green-700 rounded-xl font-medium hover:bg-green-200 transition-colors">Легко</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Налаштування простору та профіль користувача ---
        function SettingsPanel({ user, fb, workspace, showToast, logout }) {
            const handleLeave = async () => {
                if (window.confirm("Ви впевнені, що хочете покинути цей простір?")) {
                    try {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspace.id);
                        const newMembers = workspace.members.filter(m => m !== user.uid);
                        await fb.updateDoc(wsRef, { members: newMembers });
                        showToast("Ви покинули простір");
                    } catch (err) {
                        showToast("Помилка");
                    }
                }
            };

            return (
                <div className="max-w-2xl mx-auto w-full space-y-6">
                    <h2 className="text-2xl font-bold flex items-center gap-2"><Icon name="settings" /> Налаштування та профіль</h2>
                    
                    {/* Блок з даними облікового запису */}
                    <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><Icon name="user" className="text-indigo-600" /> Дані облікового запису Google</h3>
                        <div className="space-y-3 text-sm">
                            <div className="flex items-center gap-3">
                                {user.photoURL && <img src={user.photoURL} alt="Avatar" className="w-12 h-12 rounded-full border border-stone-200 shadow-sm" />}
                                <div>
                                    <p className="font-semibold text-stone-900 text-base">{user.displayName || "Користувач"}</p>
                                    <p className="text-stone-500">{user.email}</p>
                                </div>
                            </div>
                            <div className="pt-3 border-t border-stone-100 flex flex-col gap-1">
                                <span className="text-stone-400 text-xs uppercase tracking-wider">Унікальний ID користувача в базі:</span>
                                <code className="bg-stone-100 px-3 py-1.5 rounded-lg text-xs font-mono text-stone-700 select-all">{user.uid}</code>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm">
                        <h3 className="text-lg font-semibold mb-2 flex items-center gap-2"><Icon name="users" className="text-indigo-500" /> Код запрошення для партнера</h3>
                        <p className="text-sm text-stone-500 mb-4">Поділіться цим кодом, щоб підключити другу людину до вашого словника та спільних нотаток у реальному часі.</p>
                        <div className="flex items-center gap-4 bg-stone-50 p-4 rounded-xl border border-stone-200">
                            <div className="text-3xl font-mono font-bold tracking-widest text-indigo-700 bg-white px-6 py-2 rounded-lg border border-indigo-100 shadow-sm">{workspace.inviteCode}</div>
                            <span className="text-sm font-medium bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full ml-auto">Учасників: {workspace.members?.length || 0}/2</span>
                        </div>
                    </div>

                    <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h3 className="text-lg font-semibold mb-1 text-stone-800">Вихід із системи</h3>
                            <p className="text-sm text-stone-500">Завершити поточну сесію та вийти з аккаунта Google.</p>
                        </div>
                        <button onClick={logout} className="px-4 py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl transition-colors font-medium flex items-center gap-2 shrink-0">
                            <Icon name="logout" size={16} /> Вийти з аккаунта
                        </button>
                    </div>

                    <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm">
                        <h3 className="text-lg font-semibold mb-2 text-red-600">Небезпечна зона</h3>
                        <p className="text-sm text-stone-500 mb-4">Вихід з простору збереже ваші особисті нотатки, але ви втратите доступ до спільного словника до повторного входу за кодом.</p>
                        <button onClick={handleLeave} className="px-4 py-2 bg-red-50 text-red-600 rounded-xl border border-red-200 hover:bg-red-100 transition-colors font-medium">Покинути простір</button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
