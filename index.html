                columns: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="3" y2="21"/>',
                splitClose: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/><path d="m14 9-3 3 3 3"/>',
                search: '<circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/>',

                save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
                info: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>',
                check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',

                logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',

        const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);
            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            const [currentTheme, setCurrentTheme] = useState(() => {
                const saved = localStorage.getItem('engspace_theme');
                return themes[saved] ? saved : 'default';
            });
            const t = themes[currentTheme];

            const toggleTheme = () => {
                let next = 'default';
                if (currentTheme === 'default') next = 'y2k';
                else if (currentTheme === 'y2k') next = 'darkRed';
                else if (currentTheme === 'darkRed') next = 'ocean';
                else next = 'default';

                setCurrentTheme(next);
                localStorage.setItem('engspace_theme', next);
            };

            const [workspaces, setWorkspaces] = useState([]);
            const [activeWorkspace, setActiveWorkspace] = useState(null);

            const [words, setWords] = useState([]);
            const [publicNotes, setPublicNotes] = useState([]);
            const [privateNotes, setPrivateNotes] = useState([]);

            const [activeTab, setActiveTab] = useState('dictionary');
            const [isSplitScreen, setIsSplitScreen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const toastTimeoutRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3000);
            };

            useEffect(() => {
                const handleReady = () => {
                    if (window.firebaseApp) {
                        setFb(window.firebaseApp);
                        const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                        return () => unsubscribe();
                    }
                };
                if (window.firebaseApp) handleReady();
                window.addEventListener('firebase-ready', handleReady);
            }, []);

            const loginWithGoogle = async () => {
                if (!fb) {
                    showToast("Firebase ще завантажується.");
                    return;
                }

                const provider = new fb.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: "select_account" });

                try {
                    await fb.signInWithPopup(fb.auth, provider);
                } catch (err) {
                    console.error("Повна помилка входу:", err);
                    alert("Помилка входу: " + err.code + " - " + err.message);
                }
            };

            const logout = async () => {
                if (!fb) return;
                await fb.signOut(fb.auth);
                setUser(null);
                setActiveWorkspace(null);
            };

            useEffect(() => {
                if (!user || !fb) return;
                const wRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                const unsub = fb.onSnapshot(wRef, (snap) => {
                    const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setWorkspaces(allWs);
                    const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
                    setActiveWorkspace(myWs || null);
                }, (err) => console.error("Workspaces error:", err));
                return () => unsub();
            }, [user, fb]);

            useEffect(() => {
                if (!user || !activeWorkspace || !fb) return;

                const vRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'vocabulary');
                const unsubV = fb.onSnapshot(vRef, (snap) => {
                    setWords(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const nRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'notes');
                const unsubN = fb.onSnapshot(nRef, (snap) => {
                    setPublicNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: true })));
                });

                const pRef = fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                const unsubP = fb.onSnapshot(pRef, (snap) => {
                    setPrivateNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: false })));
                });

                return () => { unsubV(); unsubN(); unsubP(); };
            }, [user, activeWorkspace, fb]);

            if (authLoading) {
                return <div className={`flex h-screen items-center justify-center ${t.bg} ${t.text} text-lg font-medium`}>Завантаження EngSpace...</div>;
            }

            if (!user) {
                return (
                    <div className={`flex h-screen items-center justify-center ${t.bg} p-4 relative`}>
                        <button onClick={toggleTheme} className={`absolute top-6 right-6 p-2.5 rounded-2xl ${t.cardBg} border ${t.border} shadow-md hover:scale-110 transition-all ${t.accentText} z-10`} title={`Тема: ${t.name}`}>
                            <Icon name="palette" size={20} />
                        </button>
                        <div className={`${t.cardBg} p-8 rounded-3xl border-2 ${t.border} max-w-md w-full text-center shadow-2xl relative`}>
                            {t.bgGraphics}
                            <div className="relative z-10">
                                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg mx-auto mb-6">E</div>
                                <h1 className={`text-2xl font-bold ${t.text} mb-2`}>Ласкаво просимо до EngSpace</h1>
                                <p className="text-cyan-300/70 mb-8 text-sm">Парний хмарний простір для вивчення англійської мови</p>
                                <button onClick={loginWithGoogle} className={`w-full flex items-center justify-center gap-3 ${t.cardBg} border-2 ${t.border} hover:opacity-90 ${t.text} py-3.5 px-4 rounded-2xl font-medium transition-all shadow-md`}>
                                    <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                                    Увійти через Google
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (!activeWorkspace) {
                return <WorkspaceSetup user={user} fb={fb} workspaces={workspaces} showToast={showToast} logout={logout} t={t} toggleTheme={toggleTheme} />;
            }

            return (
                <div className={`flex flex-col h-screen overflow-hidden ${t.bg}`}>
                    <header className={`flex-none flex items-center justify-between px-6 py-4 ${t.cardBg} border-b-2 ${t.border} ${t.shadow} z-10`}>
                        {t.bgGraphics}
                        <div className="flex items-center gap-2 relative z-10">
                            <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white font-bold shadow-md">E</div>
                            <span className={`font-bold text-lg tracking-tight hidden sm:block ${t.text}`}>EngSpace</span>
                        </div>

                        <nav className={`flex items-center gap-1 sm:gap-2 ${t.navBg} p-1.5 rounded-2xl relative z-10`}>
                            <NavBtn icon={<Icon name="book" />} label="Словник" active={activeTab === 'dictionary'} onClick={() => {setActiveTab('dictionary'); setIsSplitScreen(false);}} t={t} />
                            <NavBtn icon={<Icon name="pen" />} label="Нотатки" active={activeTab === 'notes'} onClick={() => {setActiveTab('notes'); setIsSplitScreen(false);}} t={t} />
                            <NavBtn icon={<Icon name="brain" />} label="Повторення" active={activeTab === 'revision'} onClick={() => {setActiveTab('revision'); setIsSplitScreen(false);}} t={t} />
                            <NavBtn icon={<Icon name="settings" />} label="Налаштування" active={activeTab === 'settings'} onClick={() => {setActiveTab('settings'); setIsSplitScreen(false);}} t={t} />
                        </nav>

                        <div className="flex items-center gap-2 relative z-10">
                            <button onClick={toggleTheme} className={`p-2.5 rounded-2xl ${t.cardBg} border-2 ${t.border} hover:scale-110 transition-all ${t.accentText} shadow-sm`} title={`Тема: ${t.name}`}>
                                <Icon name="palette" size={18} />
                            </button>
                            <button onClick={() => setIsSplitScreen(!isSplitScreen)} className={`flex items-center gap-2 px-3.5 py-2 rounded-2xl font-medium transition-colors ${isSplitScreen ? t.primaryLight : `${t.cardBg} border ${t.border} hover:opacity-80 text-stone-400`}`}>
                                <Icon name={isSplitScreen ? "splitClose" : "columns"} />
                                <span className="hidden md:block text-sm">{isSplitScreen ? 'Закрити спліт' : 'Спліт-екран'}</span>
                            </button>
                            <button onClick={logout} className={`p-2.5 ${t.cardBg} border ${t.border} text-stone-400 hover:text-cyan-400 rounded-2xl transition-colors shadow-sm`} title="Вийти">
                                <Icon name="logout" size={18} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden p-4 sm:p-6">
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            <div className={`flex-1 flex-col ${t.cardBg} rounded-3xl ${t.shadow} border-2 ${t.border} overflow-hidden ${(activeTab === 'dictionary' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                {t.bgGraphics}
                                <div className="relative z-10 flex flex-col h-full">
                                    <DictionaryPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} showToast={showToast} t={t} />
                                </div>
                            </div>

                            <div className={`flex-1 flex-col ${t.cardBg} rounded-3xl ${t.shadow} border-2 ${t.border} overflow-hidden ${(activeTab === 'notes' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                {t.bgGraphics}
                                <div className="relative z-10 flex flex-col h-full">
                                    <NotesPanel user={user} fb={fb} workspaceId={activeWorkspace.id} publicNotes={publicNotes} privateNotes={privateNotes} showToast={showToast} t={t} />
                                </div>
                            </div>

                            {!isSplitScreen && activeTab === 'revision' && (
                                <div className={`flex-1 flex flex-col ${t.cardBg} rounded-3xl ${t.shadow} border-2 ${t.border} overflow-hidden relative`}>
                                    {t.bgGraphics}
                                    <div className="relative z-10 flex flex-col h-full">
                                        <RevisionPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} t={t} />
                                    </div>
                                </div>
                            )}

                            {!isSplitScreen && activeTab === 'settings' && (
                                <div className={`flex-1 flex flex-col ${t.cardBg} rounded-3xl ${t.shadow} border-2 ${t.border} overflow-hidden p-8 overflow-y-auto relative`}>
                                    {t.bgGraphics}
                                    <div className="relative z-10">
                                        <SettingsPanel user={user} fb={fb} workspace={activeWorkspace} showToast={showToast} logout={logout} t={t} />
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {toastMessage && (
                        <div className={`fixed bottom-6 right-6 ${t.toastBg} px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 z-50 border-2 ${t.border}`}>
                            <Icon name="info" className={t.toastIcon} size={20} />
                            <span className="font-medium">{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick, t }) => (
            <button onClick={onClick} className={`flex items-center gap-2 px-3.5 py-2 rounded-xl transition-all ${active ? `${t.cardBg} ${t.accentText} shadow-md font-bold scale-105 border ${t.border}` : 'text-stone-400 hover:text-stone-200 hover:bg-slate-900/50'}`}>
                {icon}
                <span className="hidden md:block text-sm">{label}</span>
            </button>
        );

        function WorkspaceSetup({ user, fb, workspaces, showToast, logout, t, toggleTheme }) {
            const [joinCode, setJoinCode] = useState('');
            const [loading, setLoading] = useState(false);

            const handleCreate = async () => {
                setLoading(true);
                try {
                    const code = generateInviteCode();
                    const wsRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                    await fb.addDoc(wsRef, {
                        inviteCode: code,
                        members: [user.uid],
                        createdAt: Date.now()
                    });
                    showToast("Простір створено!");
                } catch (err) {
                    showToast("Помилка створення простору");
                }
                setLoading(false);
            };

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!joinCode.trim()) return;
                setLoading(true);
                try {
                    const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
                    if (!wsToJoin) {
                        showToast("Код не знайдено");
                    } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
                        showToast("Робочий простір вже має двох учасників");
                    } else {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', wsToJoin.id);
                        const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
                        await fb.updateDoc(wsRef, { members: updatedMembers });
                        showToast("Успішно приєднано!");
                    }
                } catch (err) {
                    showToast("Помилка приєднання");
                }
                setLoading(false);
            };

            return (
                <div className={`flex h-screen items-center justify-center ${t.bg} p-4 relative`}>
                    <div className="absolute top-6 right-6 flex items-center gap-3 z-10">
                        <button onClick={toggleTheme} className={`p-2.5 rounded-2xl ${t.cardBg} border-2 ${t.border} shadow-md hover:scale-110 transition-all ${t.accentText}`} title="Змінити тему">
                            <Icon name="palette" size={18} />
                        </button>
                        <button onClick={logout} className={`flex items-center gap-2 text-stone-300 ${t.cardBg} px-4 py-2.5 rounded-2xl border-2 ${t.border} shadow-md text-sm font-medium`}>
                            <Icon name="logout" size={16} /> Вийти ({user.email})
                        </button>
                    </div>
                    <div className={`${t.cardBg} p-8 rounded-3xl shadow-2xl border-2 ${t.border} max-w-md w-full relative`}>
                        {t.bgGraphics}
                        <div className="relative z-10">
                            <div className="flex justify-center mb-6">
                                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">E</div>
                            </div>
                            <h1 className={`text-2xl font-bold text-center ${t.text} mb-2`}>Робочий простір</h1>
                            <p className="text-center text-cyan-300/70 mb-8 text-sm">Створіть новий простір або приєднайтеся за кодом партнера</p>

                            <button onClick={handleCreate} disabled={loading} className={`w-full flex items-center justify-center gap-2 ${t.primary} py-3.5 rounded-2xl font-medium transition-colors mb-6 shadow-md disabled:opacity-50`}>
                                <Icon name="plus" size={20} /> Створити новий простір
                            </button>

                            <div className="relative flex py-4 items-center">
                                <div className={`flex-grow border-t-2 ${t.border}`}></div>
                                <span className="flex-shrink-0 mx-4 text-cyan-500/50 text-sm">або</span>
                                <div className={`flex-grow border-t-2 ${t.border}`}></div>
                            </div>

                            <form onSubmit={handleJoin} className="space-y-4">
                                <div>
                                    <label className={`block text-sm font-medium ${t.text} mb-1`}>Код запрошення</label>
                                    <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className={`w-full px-4 py-3.5 ${t.inputBg} border-2 ${t.border} rounded-2xl focus:ring-2 focus:ring-cyan-400/30 outline-none uppercase text-center tracking-widest text-lg font-mono`} maxLength={6} />
                                </div>
                                <button type="submit" disabled={loading || !joinCode.trim()} className={`w-full ${t.secondaryBtn} py-3.5 rounded-2xl font-medium transition-colors disabled:opacity-50 shadow-md`}>
                                    Приєднатися
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function DictionaryPanel({ user, fb, workspaceId, words, showToast, t }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    ...formData,
                    addedBy: user.uid,
                    createdAt: Date.now(),
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary');
                    await fb.addDoc(colRef, newWord);
                    setFormData({ en: '', uk: '', example: '' });
                    showToast("Слово збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const handleDelete = async (id) => {
                try {
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', id));
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            const filteredWords = words.filter(w => w.en.toLowerCase().includes(search.toLowerCase()) || w.uk.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="flex flex-col h-full bg-transparent">
                    <div className={`flex-none p-4 md:p-6 ${t.cardBg} border-b-2 ${t.border} relative`}>
                        <form onSubmit={handleSave} className="space-y-3 relative z-10">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className={`flex-1 px-4 py-2.5 border-2 ${t.border} rounded-2xl outline-none focus:border-cyan-400 ${t.inputBg}`} />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className={`flex-1 px-4 py-2.5 border-2 ${t.border} rounded-2xl outline-none focus:border-cyan-400 ${t.inputBg}`} />
                                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className={`px-6 py-2.5 ${t.primary} rounded-2xl disabled:opacity-50 flex gap-2 justify-center items-center shadow-md`}>
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className={`w-full px-4 py-2 border-2 ${t.border} rounded-2xl outline-none focus:border-cyan-400 text-sm ${t.inputBg}`} />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0">
                        <div className={`p-4 flex-none border-b-2 ${t.border} ${t.cardBg} sticky top-0`}>
                            <div className="relative">
                                <span className="absolute left-3.5 top-3 text-cyan-500/60"><Icon name="search" size={16} /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук у спільному словнику..." className={`w-full pl-10 pr-4 py-2.5 ${t.inputBg} border-2 ${t.border} rounded-2xl text-sm outline-none focus:border-cyan-400`} />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className="text-center text-cyan-500/60 mt-10">Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className={`group ${t.cardBg} p-4 rounded-2xl border-2 ${t.border} shadow-sm hover:shadow-md transition-all flex justify-between items-start gap-4`}>
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className={`font-bold text-lg ${t.text}`}>{word.en}</span>
                                                <span className={`${t.accentText} font-medium`}>{word.uk}</span>
                                            </div>
                                            {word.example && <p className="text-cyan-300/60 italic text-sm mt-1">"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className="text-cyan-600 hover:text-red-400 p-2 rounded-xl hover:bg-cyan-950/40 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function NotesPanel({ user, fb, workspaceId, publicNotes, privateNotes, showToast, t }) {
            const [activeNote, setActiveNote] = useState(null);
            const [isCreating, setIsCreating] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isShared, setIsShared] = useState(true);

            const allNotes = useMemo(() => [...publicNotes, ...privateNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [publicNotes, privateNotes]);
            const filteredNotes = allNotes.filter(n => n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setIsCreating(false);
                setTitle(note.title);
                setContent(note.content);
                setIsShared(note.isShared);
            };

            const saveNote = async () => {
                if (!title.trim() && !content.trim()) return;
                const noteData = { title: title || 'Без назви', content, updatedAt: Date.now() };

                try {
                    if (activeNote) {
                        if (activeNote.isShared !== isShared) {
                            const oldPath = activeNote.isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.deleteDoc(oldPath);

                            const newCol = isShared 
                                ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                                : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                            const newDoc = await fb.addDoc(newCol, { ...noteData, createdAt: activeNote.createdAt || Date.now() });
                            setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        } else {
                            const ref = isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.updateDoc(ref, noteData);
                            setActiveNote({ ...activeNote, ...noteData });
                        }
                    } else {
                        const col = isShared 
                            ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                            : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                        const newDoc = await fb.addDoc(col, { ...noteData, createdAt: Date.now() });
                        setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        setIsCreating(false);
                    }
                    showToast("Нотатку збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const deleteNote = async (note) => {
                try {
                    const ref = note.isShared 
                        ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', note.id)
                        : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', note.id);
                    await fb.deleteDoc(ref);
                    if (activeNote?.id === note.id) {
                        setActiveNote(null);
                        setIsCreating(false);
                    }
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            return (
                <div className="flex h-full">
                    <div className={`w-full md:w-1/3 border-r-2 ${t.border} flex flex-col bg-transparent ${(activeNote || isCreating) ? 'hidden md:flex' : 'flex'}`}>
                        <div className={`p-4 border-b-2 ${t.border}`}>
                            <button onClick={() => { setActiveNote(null); setTitle(''); setContent(''); setIsCreating(true); }} className={`w-full flex items-center justify-center gap-2 ${t.cardBg} border-2 ${t.border} hover:border-cyan-400 py-2.5 rounded-2xl text-sm font-semibold shadow-sm transition-all ${t.text}`}>
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className={`p-3 border-b-2 ${t.border} ${t.cardBg}`}>
                            <div className="relative">
                                <span className="absolute left-3.5 top-3 text-cyan-500/60"><Icon name="search" size={16} /></span>
                                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className={`w-full pl-10 pr-3 py-2 ${t.inputBg} border-2 ${t.border} rounded-2xl text-sm outline-none focus:border-cyan-400`} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3.5 rounded-2xl cursor-pointer border-2 transition-all ${activeNote?.id === note.id ? `${t.primaryLight} border-cyan-400 shadow-sm` : `hover:bg-cyan-950/30 border-transparent`}`}>
                                    <div className="flex items-center justify-between mb-1">
                                        <h4 className={`font-semibold ${t.text} truncate pr-2`}>{note.title}</h4>
                                        {note.isShared ? <span title="Спільна"><Icon name="users" size={14} className={t.accentText} /></span> : <span title="Особиста"><span className="text-xs bg-cyan-950 px-2 py-0.5 rounded-xl font-medium text-cyan-300 border border-cyan-800/50">Особиста</span></span>}
                                    </div>
                                    <p className="text-xs text-cyan-300/60 truncate">{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col ${t.cardBg} ${!activeNote && !isCreating && allNotes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && !isCreating && title === '' && content === '') ? (
                            <div className="text-center text-cyan-500/60 flex flex-col items-center gap-3">
                                <Icon name="pen" size={48} className="opacity-20" />
                                <p>Оберіть нотатку або створіть нову</p>
                            </div>
                        ) : (
                            <>
                                <div className={`flex items-center justify-between p-4 border-b-2 ${t.border}`}>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setActiveNote(null); setIsCreating(false); }} className="md:hidden text-cyan-400"><Icon name="splitClose" className="rotate-180" /></button>
                                        <div className={`flex ${t.navBg} p-1 rounded-2xl border-2 ${t.border}`}>
                                            <button onClick={() => setIsShared(true)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${isShared ? `${t.cardBg} shadow-md ${t.accentText}` : 'text-stone-500'}`}>Спільна</button>
                                            <button onClick={() => setIsShared(false)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${!isShared ? `${t.cardBg} shadow-md ${t.text}` : 'text-stone-500'}`}>Особиста</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {activeNote && <button onClick={() => deleteNote(activeNote)} className="p-2.5 text-cyan-500/60 hover:text-red-400 rounded-2xl hover:bg-cyan-950/40 transition-colors"><Icon name="trash" size={18} /></button>}
                                        <button onClick={saveNote} className={`flex items-center gap-2 ${t.secondaryBtn} px-4 py-2.5 rounded-2xl text-sm font-semibold transition-colors shadow-md`}><Icon name="save" size={16} /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className={`text-2xl font-bold border-none outline-none mb-4 bg-transparent placeholder:text-cyan-900/60 ${t.text}`} />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Почніть писати тут..." className={`flex-1 w-full resize-none border-none outline-none bg-transparent ${t.text} leading-relaxed`} />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function RevisionPanel({ user, fb, workspaceId, words, t }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now).sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0) {
                    if (!currentWord || !dueWords.find(w => w.id === currentWord.id)) {
                        setCurrentWord(dueWords[0]);
                        setShowAnswer(false);
                    }
                } else {
                    setCurrentWord(null);
                }
            }, [dueWords, currentWord]);

            const handleRating = async (quality) => {
                if (!currentWord) return;
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

                try {
                    const wRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', currentWord.id);
                    await fb.updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
                    setCurrentWord(null);
                    setShowAnswer(false);
                } catch (err) {
                    console.error("Review update error", err);
                }
            };

            return (
                <div className="flex flex-col h-full relative p-6 bg-transparent">
                    <h2 className={`text-xl font-bold flex items-center gap-2 mb-6 ${t.text}`}><Icon name="brain" className={t.accentText}/> Тренування ({dueWords.length} слів)</h2>
                    <div className="flex-1 flex items-center justify-center">
                        {!currentWord ? (
                            <div className={`text-center p-10 ${t.cardBg} rounded-3xl border-2 ${t.border} shadow-xl max-w-sm w-full relative`}>
                                {t.bgGraphics}
                                <div className="relative z-10">
                                    <div className="text-cyan-400 flex justify-center mb-4"><Icon name="check" size={48}/></div>
                                    <h3 className={`text-2xl font-bold mb-2 ${t.text}`}>Відмінно!</h3>
                                    <p className="text-cyan-300/60">Всі слова на сьогодні повторені.</p>
                                </div>
                            </div>
                        ) : (
                            <div className={`w-full max-w-xl ${t.cardBg} rounded-3xl border-2 ${t.border} p-10 text-center shadow-2xl relative`}>
                                {t.bgGraphics}
                                <div className="relative z-10">
                                    <h2 className={`text-5xl font-bold mb-8 ${t.text}`}>{currentWord.en}</h2>
                                    {!showAnswer ? (
                                        <button onClick={() => setShowAnswer(true)} className={`w-full py-4 ${t.secondaryBtn} rounded-2xl font-bold transition-transform active:scale-95 shadow-md`}>Показати переклад</button>
                                    ) : (
                                        <div className={`border-t-2 ${t.border} pt-8 animate-in fade-in`}>
                                            <h3 className={`text-3xl font-bold ${t.accentText} mb-6`}>{currentWord.uk}</h3>
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                <button onClick={() => handleRating(0)} className="py-3 bg-red-950/70 text-red-300 border border-red-900/60 rounded-2xl font-semibold hover:bg-red-900/60 transition-colors shadow-sm">Забув/ла</button>
                                                <button onClick={() => handleRating(3)} className="py-3 bg-slate-900 text-cyan-200 border border-cyan-900/60 rounded-2xl font-semibold hover:bg-slate-800 transition-colors shadow-sm">Важко</button>
                                                <button onClick={() => handleRating(4)} className="py-3 bg-slate-900 text-cyan-200 border border-cyan-900/60 rounded-2xl font-semibold hover:bg-slate-800 transition-colors shadow-sm">Добре</button>
                                                <button onClick={() => handleRating(5)} className="py-3 bg-cyan-950/70 text-cyan-200 border border-cyan-700/50 rounded-2xl font-semibold hover:bg-cyan-900/60 transition-colors shadow-sm">Легко</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsPanel({ user, fb, workspace, showToast, logout, t }) {
            const handleLeave = async () => {
                if (window.confirm("Ви впевнені, що хочете покинути цей простір?")) {
                    try {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspace.id);
                        const newMembers = workspace.members.filter(m => m !== user.uid);
                        await fb.updateDoc(wsRef, { members: newMembers });
                        showToast("Ви покинули простір");
                    } catch (err) {
                        showToast("Помилка");
                    }
                }
            };

            return (
                <div className="max-w-2xl mx-auto w-full space-y-6">
                    <h2 className={`text-2xl font-bold flex items-center gap-2 ${t.text}`}><Icon name="settings" /> Налаштування та профіль</h2>
                    
                    <div className={`${t.cardBg} border-2 ${t.border} rounded-3xl p-6 shadow-md relative`}>
                        {t.bgGraphics}
                        <div className="relative z-10">
                            <h3 className={`text-lg font-semibold mb-4 flex items-center gap-2 ${t.text}`}><Icon name="user" className={t.accentText} /> Дані облікового запису Google</h3>
                            <div className="space-y-3 text-sm">
                                <div className="flex items-center gap-3">
                                    {user.photoURL && <img src={user.photoURL} alt="Avatar" className={`w-12 h-12 rounded-2xl border-2 ${t.border} shadow-sm`} />}
                                    <div>
                                        <p className={`font-bold ${t.text} text-base`}>{user.displayName || "Користувач"}</p>
                                        <p className="text-cyan-300/60">{user.email}</p>
                                    </div>
                                </div>
                                <div className={`pt-3 border-t-2 ${t.border} flex flex-col gap-1`}>
                                    <span className="text-cyan-500/60 text-xs uppercase tracking-wider">Унікальний ID користувача в базі:</span>
                                    <code className={`${t.navBg} px-3.5 py-2 rounded-xl text-xs font-mono text-cyan-300/80 select-all border ${t.border}`}>{user.uid}</code>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className={`${t.cardBg} border-2 ${t.border} rounded-3xl p-6 shadow-md relative`}>
                        {t.bgGraphics}
                        <div className="relative z-10">
                            <h3 className={`text-lg font-semibold mb-2 flex items-center gap-2 ${t.text}`}><Icon name="users" className={t.accentText} /> Код запрошення для партнера</h3>
                            <p className="text-sm text-cyan-300/60 mb-4">Поділіться цим кодом, щоб підключити другу людину до вашого словника та спільних нотаток у реальному часі.</p>
                            <div className={`flex items-center gap-4 ${t.navBg} p-4 rounded-2xl border-2 ${t.border}`}>
                                <div className={`text-3xl font-mono font-bold tracking-widest ${t.accentText} ${t.cardBg} px-6 py-2.5 rounded-xl border-2 ${t.border} shadow-sm`}>{workspace.inviteCode}</div>
                                <span className={`text-sm font-bold ${t.primaryLight} px-4 py-1.5 rounded-xl ml-auto border`}>Учасників: {workspace.members?.length || 0}/2</span>
                            </div>
                        </div>
                    </div>

                    <div className={`${t.cardBg} border-2 ${t.border} rounded-3xl p-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 relative`}>
                        {t.bgGraphics}
                        <div className="relative z-10">
                            <h3 className={`text-lg font-semibold mb-1 ${t.text}`}>Вихід із системи</h3>
                            <p className="text-sm text-cyan-300/60">Завершити поточну сесію та вийти з аккаунта Google.</p>
                        </div>
                        <button onClick={logout} className={`px-5 py-3 ${t.navBg} hover:opacity-80 ${t.text} rounded-2xl transition-colors font-semibold flex items-center gap-2 shrink-0 border-2 ${t.border} shadow-sm relative z-10`}>
                            <Icon name="logout" size={16} /> Вийти з аккаунта
                        </button>
                    </div>

                    <div className={`${t.cardBg} border-2 ${t.border} rounded-3xl p-6 shadow-md relative`}>
                        {t.bgGraphics}
                        <div className="relative z-10">
                            <h3 className="text-lg font-semibold mb-2 text-red-400">Небезпечна зона</h3>
                            <p className="text-sm text-cyan-300/60 mb-4">Вихід з простору збереже ваші особисті нотатки, але ви втратите доступ до спільного словника до повторного входу за кодом.</p>
                            <button onClick={handleLeave} className="px-5 py-3 bg-red-950/60 text-red-300 rounded-2xl border-2 border-red-900/80 hover:bg-red-900/50 transition-colors font-semibold shadow-sm">Покинути простір</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
