    <style>
        /* Стилі для теми Abyss Ocean (Glassmorphism) */
        .abyss-bg {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, 
                #010409 0%, 
                #031329 18%, 
                #051d3b 38%, 
                #031226 62%, 
                #020c1b 82%, 
                #04182e 100%
            );
        }

        .abyss-ray-core {
            background: radial-gradient(ellipse at 50% 0%, 
                rgba(186, 230, 253, 0.45) 0%, 
                rgba(56, 189, 248, 0.22) 32%, 
                rgba(14, 165, 233, 0.06) 60%, 
                transparent 80%
            );
            filter: blur(28px);
            animation: rayPulse 9s ease-in-out infinite;
        }

        .abyss-ray-beam {
            background: conic-gradient(from 165deg at 50% 0%, 
                transparent 0deg, 
                rgba(125, 211, 252, 0.2) 12deg, 
                rgba(224, 242, 254, 0.28) 18deg, 
                rgba(56, 189, 248, 0.12) 26deg, 
                transparent 38deg
            );
            filter: blur(18px);
            opacity: 0.85;
            animation: beamSway 12s ease-in-out infinite alternate;
        }

        @keyframes rayPulse {
            0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        @keyframes beamSway {
            0% { transform: translateX(-52%) rotate(-2deg); }
            100% { transform: translateX(-48%) rotate(2deg); }
        }

        .jellyfish-float {
            animation: jellyDrift 7s ease-in-out infinite;
            filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.55));
        }

        .jellyfish-float-delayed {
            animation: jellyDriftAlt 9s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(103, 232, 249, 0.45));
        }

        @keyframes jellyDrift {
            0%, 100% { transform: translateY(0px) rotate(-4deg); }
            50% { transform: translateY(-18px) rotate(3deg); }
        }

        @keyframes jellyDriftAlt {
            0%, 100% { transform: translateY(0px) rotate(5deg) scale(0.96); }
            50% { transform: translateY(-22px) rotate(-3deg) scale(1.03); }
        }

        .plankton-dot {
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(224, 242, 254, 0.95) 0%, rgba(56, 189, 248, 0.3) 60%, transparent 100%);
            pointer-events: none;
            animation: floatPlankton linear infinite;
        }

        @keyframes floatPlankton {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-140px) translateX(25px); opacity: 0; }
        }

        .abyss-glass-panel {
            background: linear-gradient(145deg, 
                rgba(15, 42, 78, 0.48) 0%, 
                rgba(5, 19, 38, 0.72) 55%, 
                rgba(8, 28, 56, 0.58) 100%
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(147, 210, 255, 0.32);
            box-shadow: 
                0 20px 50px rgba(0, 4, 12, 0.75),
                0 0 35px rgba(56, 189, 248, 0.14),
                inset 0 1px 1px rgba(224, 242, 254, 0.35),
                inset 0 -1px 1px rgba(56, 189, 248, 0.15);
        }

        .abyss-sub-card {
            background: linear-gradient(180deg, rgba(16, 52, 94, 0.45) 0%, rgba(4, 16, 34, 0.78) 100%);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(186, 230, 253, 0.28);
            box-shadow: 0 10px 25px rgba(0, 5, 15, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        /* Стилі для нової теми Deep Ocean (Jellyfish & Coral Reef) */
        .deep-ocean-bg {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, 
                #010409 0%, 
                #031329 18%, 
                #051d3b 38%, 
                #031226 62%, 
                #020c1b 82%, 
                #04182e 100%
            );
        }

        .deep-glass-panel {
            background: linear-gradient(145deg, 
                rgba(15, 42, 78, 0.44) 0%, 
                rgba(5, 19, 38, 0.68) 55%, 
                rgba(8, 28, 56, 0.52) 100%
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(147, 210, 255, 0.36);
            box-shadow: 
                0 20px 50px rgba(0, 4, 12, 0.75),
                0 0 38px rgba(56, 189, 248, 0.18),
                inset 0 1px 1px rgba(224, 242, 254, 0.42),
                inset 0 -1px 1px rgba(56, 189, 248, 0.18);
        }

        .deep-sub-card {
            background: linear-gradient(180deg, rgba(16, 52, 94, 0.52) 0%, rgba(4, 16, 34, 0.82) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(186, 230, 253, 0.34);
            box-shadow: 
                0 12px 28px rgba(0, 5, 15, 0.65),
                inset 0 1px 1px rgba(255, 255, 255, 0.32);
            transition: all 0.3s ease;
        }
        .deep-sub-card:hover {
            border-color: rgba(125, 211, 252, 0.8);
            box-shadow: 
                0 15px 35px rgba(0, 10, 25, 0.8),
                0 0 24px rgba(56, 189, 248, 0.28),
                inset 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .abyss-pill-btn {
            background: linear-gradient(180deg, rgba(30, 78, 130, 0.55) 0%, rgba(7, 24, 48, 0.85) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(147, 210, 255, 0.45);
            box-shadow: 0 6px 20px rgba(0, 5, 15, 0.65), 0 0 18px rgba(56, 189, 248, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transition: all 0.25s ease;
        }
        .abyss-pill-btn:hover {
            border-color: rgba(186, 230, 253, 0.85);
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.4) 0%, rgba(12, 42, 78, 0.9) 100%);
            box-shadow: 0 8px 25px rgba(0, 10, 25, 0.8), 0 0 26px rgba(56, 189, 248, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.55);
        }

        .text-glow-abyss {
            text-shadow: 0 0 24px rgba(186, 230, 253, 0.45), 0 4px 14px rgba(0, 5, 15, 0.85);
        }
    </style>
</head>

    <script type="text/babel">

                                <radialGradient id="jellyBellApp" cx="45%" cy="30%" r="65%">
                                    <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>

                                    <stop offset="100%" stopColor="#0284c7" stopOpacity="0"/>

                            </defs>
                            <g transform="rotate(-18 110 110)">
                                <path d="M72 118 Q62 175 84 235" stroke="url(#tentacleGradApp)" strokeWidth="2.2" strokeLinecap="round"/>

                                <path d="M142 116 Q155 170 140 230" stroke="url(#tentacleGradApp)" strokeWidth="1.8" strokeLinecap="round"/>
                                <path d="M52 112 C52 58, 168 58, 168 112 C168 124, 146 128, 134 122 C122 128, 98 128, 86 122 C74 128, 52 124, 52 112 Z" fill="url(#jellyBellApp)" stroke="#e0f2fe" strokeOpacity="0.65" strokeWidth="1.2"/>
                                <ellipse cx="110" cy="84" rx="34" ry="15" fill="#ffffff" fillOpacity="0.35"/>
                            </g>
                        </svg>
                    </div>

                    <div className="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-cyan-500/20 via-sky-900/10 to-transparent"></div>
                    <div className="absolute -bottom-10 left-[15%] w-72 h-36 rounded-full bg-purple-500/15 blur-3xl"></div>
                    <div className="absolute -bottom-10 right-[18%] w-80 h-40 rounded-full bg-cyan-400/20 blur-3xl"></div>
                </div>

        };

        const AbyssPanelDecor = () => (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
                <svg className="w-full h-full opacity-35" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid slice">

                        </radialGradient>
                    </defs>
                    <rect width="700" height="420" fill="url(#panelWaterGlow)"/>
                    <g fill="#010914" opacity="0.65">
                        <path d="M220 225 C255 212, 295 214, 330 226 L355 208 L345 230 L365 242 L338 238 C302 246, 260 244, 220 225 Z M275 216 L288 194 L298 217 Z"/>
                        <path d="M415 165 C445 154, 480 156, 512 168 L534 152 L525 172 L542 182 L518 178 C486 185, 450 182, 415 165 Z M465 157 L476 138 L484 158 Z"/>

                    <g fill="#bae6fd" opacity="0.28">
                        <circle cx="85" cy="295" r="2.5"/><circle cx="98" cy="272" r="1.8"/><circle cx="74" cy="258" r="3"/>
                        <circle cx="590" cy="290" r="2.5"/><circle cx="608" cy="265" r="2"/><circle cx="580" cy="250" r="1.5"/>

                </svg>
                <div className="absolute bottom-3 right-5 text-[10px] font-mono tracking-[0.2em] text-sky-200/35 uppercase select-none">
                    FIRST EDITION • 2025 ✦
                </div>
            </div>
        );

        // Векторна медуза як окремий компонент для теми Deep Ocean
        const JellyfishSvg = ({ className = "", gradId = "jf" }) => (
            <svg className={className} viewBox="0 0 220 280" fill="none">
                <defs>
                    <radialGradient id={`${gradId}Bell`} cx="45%" cy="30%" r="65%">
                        <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95"/>
                        <stop offset="38%" stopColor="#7dd3fc" stopOpacity="0.72"/>
                        <stop offset="78%" stopColor="#0284c7" stopOpacity="0.35"/>

                    </radialGradient>
                    <linearGradient id={`${gradId}Tentacle`} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#bae6fd" stopOpacity="0.8"/>
                        <stop offset="60%" stopColor="#38bdf8" stopOpacity="0.32"/>

                </defs>
                <g transform="rotate(-16 110 110)">
                    <path d="M72 118 Q62 175 84 235" stroke={`url(#${gradId}Tentacle)`} strokeWidth="2.2" strokeLinecap="round"/>
                    <path d="M88 122 Q98 185 82 255" stroke={`url(#${gradId}Tentacle)`} strokeWidth="3" strokeLinecap="round"/>
                    <path d="M106 124 Q100 190 118 265" stroke={`url(#${gradId}Tentacle)`} strokeWidth="2.5" strokeLinecap="round"/>

                    <ellipse cx="110" cy="84" rx="34" ry="15" fill="#ffffff" fillOpacity="0.38"/>
                </g>
            </svg>
        );

        // Новий графічний шар для теми Deep Ocean: об'ємні промені, 3 плаваючі медузи, морська зірка та біолюмінесцентний кораловий риф
        const DeepOceanGlobalLayer = () => {
            const dots = useMemo(() => Array.from({ length: 30 }).map((_, i) => ({
                id: i,
                size: (i % 4) + 1.5,
                left: `${(i * 19 + 7) % 100}%`,
                top: `${(i * 29 + 11) % 100}%`,
                duration: `${(i % 7) + 7}s`,
                delay: `${i % 6}s`
            })), []);

            return (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
                    {/* Промені світла з поверхні океану */}
                    <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-6xl h-[900px]">
                        <div className="abyss-ray-core absolute -top-28 left-1/2 -translate-x-1/2 w-[720px] h-[780px]"></div>
                        <div className="abyss-ray-beam absolute -top-14 left-1/2 w-[450px] h-[820px]"></div>
                    </div>

                    {/* Плаваючий біолюмінесцентний планктон */}
                    {dots.map(d => (
                        <span
                            key={d.id}
                            className="plankton-dot"
                            style={{
                                width: `${d.size}px`,
                                height: `${d.size}px`,
                                left: d.left,
                                top: d.top,
                                animationDuration: d.duration,
                                animationDelay: d.delay
                            }}
                        />
                    ))}

                    {/* Головна велика медуза праворуч угорі */}
                    <div className="absolute top-20 right-[3%] sm:right-[7%] lg:right-[11%] opacity-85 jellyfish-float">
                        <JellyfishSvg className="w-40 h-52 sm:w-52 sm:h-64" gradId="deepMain" />
                    </div>

                    {/* Друга плаваюча медуза ліворуч по центру */}
                    <div className="absolute top-[42%] left-[2%] sm:left-[5%] opacity-60 jellyfish-float-delayed">
                        <JellyfishSvg className="w-28 h-36 sm:w-36 sm:h-44 -scale-x-100" gradId="deepLeft" />
                    </div>

                    {/* Третя невелика медуза праворуч знизу */}
                    <div className="hidden md:block absolute bottom-24 right-[14%] opacity-55 jellyfish-float">
                        <JellyfishSvg className="w-24 h-32" gradId="deepBottom" />
                    </div>

                    {/* Морська зірка на задньому плані ліворуч */}
                    <div className="absolute bottom-28 left-[4%] sm:left-[10%] opacity-40">
                        <svg className="w-36 h-36 sm:w-48 sm:h-48 text-sky-300/30" viewBox="0 0 200 200" fill="none">
                            <defs>
                                <radialGradient id="deepStarfish" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stopColor="#7dd3fc" stopOpacity="0.45"/>
                                    <stop offset="75%" stopColor="#0c4a6e" stopOpacity="0.25"/>
                                    <stop offset="100%" stopColor="#020617" stopOpacity="0"/>
                                </radialGradient>
                            </defs>
                            <path d="M100 14 L122 72 L184 76 L135 114 L152 175 L100 140 L48 175 L65 114 L16 76 L78 72 Z" fill="url(#deepStarfish)" stroke="#bae6fd" strokeOpacity="0.35" strokeWidth="1.5" strokeLinejoin="round"/>
                        </svg>
                    </div>

                    {/* Біолюмінесцентний кораловий риф на дні (ціановий + фіолетовий) */}
                    <div className="absolute inset-x-0 bottom-0 h-56">
                        <div className="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-cyan-500/30 via-sky-900/20 to-transparent"></div>
                        <div className="absolute bottom-2 left-[12%] w-64 h-36 rounded-full bg-purple-500/25 blur-3xl"></div>

                        <svg className="w-full h-full object-cover opacity-80" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
                            <defs>
                                <linearGradient id="deepCoralCyan" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#67e8f9" stopOpacity="0.85"/>
                                    <stop offset="100%" stopColor="#0369a1" stopOpacity="0.25"/>
                                </linearGradient>
                                <linearGradient id="deepCoralViolet" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#d8b4fe" stopOpacity="0.75"/>
                                    <stop offset="100%" stopColor="#4c1d95" stopOpacity="0.2"/>
                                </linearGradient>
                                <linearGradient id="deepReefBase" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stopColor="#0c4a6e" stopOpacity="0.55"/>
                                    <stop offset="100%" stopColor="#020617" stopOpacity="0.98"/>
                                </linearGradient>
                            </defs>
                            <path d="M0 215 Q220 180 450 208 T920 195 T1200 208 L1200 260 L0 260 Z" fill="url(#deepReefBase)"/>
                            <g fill="url(#deepCoralCyan)" opacity="0.8">
                                <ellipse cx="260" cy="220" rx="65" ry="22"/>
                                <ellipse cx="600" cy="226" rx="95" ry="20"/>
                                <ellipse cx="555" cy="218" rx="48" ry="13" fill="#a5f3fc" opacity="0.7"/>
                            </g>
                            <g fill="url(#deepCoralViolet)" opacity="0.8">
                                <ellipse cx="910" cy="204" rx="75" ry="24"/>
                                <ellipse cx="875" cy="196" rx="42" ry="15" fill="#f0abfc" opacity="0.55"/>
                            </g>
                        </svg>
                    </div>
                </div>
            );
        };

        // Внутрішній декор великих скляних панелей для Deep Ocean (плаваючі медузи + зграї рибок + промені)
        const DeepOceanPanelDecor = () => (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
                <svg className="w-full h-full opacity-45" viewBox="0 0 700 420" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <radialGradient id="deepPanelWater" cx="50%" cy="10%" r="85%">
                            <stop offset="0%" stopColor="#7dd3fc" stopOpacity="0.45"/>
                            <stop offset="45%" stopColor="#0284c7" stopOpacity="0.18"/>
                            <stop offset="100%" stopColor="#020a18" stopOpacity="0.55"/>
                        </radialGradient>
                    </defs>
                    <rect width="700" height="420" fill="url(#deepPanelWater)"/>
                    {/* Зграйки рибок у глибині панелі */}
                    <g fill="#031329" opacity="0.72">

        const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);
            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            const [currentTheme, setCurrentTheme] = useState(() => {
                const saved = localStorage.getItem('engspace_theme');
                return themes[saved] ? saved : 'deepOcean';
            });
            const t = themes[currentTheme];

            const toggleTheme = () => {
                const order = ['default', 'y2k', 'abyssOcean', 'deepOcean'];
                const next = order[(order.indexOf(currentTheme) + 1) % order.length];
                setCurrentTheme(next);
                localStorage.setItem('engspace_theme', next);
                showToast(`Тема: ${themes[next].name}`);
            };

            const [activeWorkspace, setActiveWorkspace] = useState(null);

            const [words, setWords] = useState([]);
            const [publicNotes, setPublicNotes] = useState([]);
            const [privateNotes, setPrivateNotes] = useState([]);

            const [activeTab, setActiveTab] = useState('dictionary');

            const [toastMessage, setToastMessage] = useState(null);
            const toastTimeoutRef = useRef(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3000);
            };

            useEffect(() => {
                const handleReady = () => {
                    if (window.firebaseApp) {
                        setFb(window.firebaseApp);
                        const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                        return () => unsubscribe();
                    }
                };
                if (window.firebaseApp) handleReady();
                window.addEventListener('firebase-ready', handleReady);
            }, []);

            const loginWithGoogle = async () => {
                if (!fb) {
                    showToast("Firebase ще завантажується.");
                    return;
                }

                const provider = new fb.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: "select_account" });

                try {
                    await fb.signInWithPopup(fb.auth, provider);
                } catch (err) {
                    console.error("Повна помилка входу:", err);
                    alert("Помилка входу: " + err.code + " - " + err.message);
                }
            };

                if (!fb) return;
                await fb.signOut(fb.auth);
                setUser(null);
                setActiveWorkspace(null);
            };

                if (!user || !fb) return;
                const wRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                const unsub = fb.onSnapshot(wRef, (snap) => {
                    const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setWorkspaces(allWs);
                    const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
                    setActiveWorkspace(myWs || null);
                }, (err) => console.error("Workspaces error:", err));
                return () => unsub();

                            <span className="font-medium">{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick, t }) => (
            <button onClick={onClick} className={`flex items-center gap-2 px-3.5 py-2 rounded-xl transition-all ${active ? `${t.subCardBg} ${t.accentText} shadow-md font-bold scale-105 border ${t.border}` : 'text-sky-200/65 hover:text-white hover:bg-sky-400/10'}`}>
                {icon}
                <span className="hidden md:block text-sm">{label}</span>
            </button>
        );

        function WorkspaceSetup({ user, fb, workspaces, showToast, logout, t, toggleTheme }) {
            const [joinCode, setJoinCode] = useState('');
            const [loading, setLoading] = useState(false);

            const handleCreate = async () => {
                setLoading(true);
                try {
                    const code = generateInviteCode();
                    const wsRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                    await fb.addDoc(wsRef, {
                        inviteCode: code,
                        members: [user.uid],
                        createdAt: Date.now()
                    });
                    showToast("Простір створено!");
                } catch (err) {
                    showToast("Помилка створення простору");
                }
                setLoading(false);
            };

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!joinCode.trim()) return;
                setLoading(true);
                try {
                    const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
                    if (!wsToJoin) {
                        showToast("Код не знайдено");
                    } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
                        showToast("Робочий простір вже має двох учасників");
                    } else {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', wsToJoin.id);
                        const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
                        await fb.updateDoc(wsRef, { members: updatedMembers });
                        showToast("Успішно приєднано!");
                    }
                } catch (err) {
                    showToast("Помилка приєднання");
                }
                setLoading(false);
            };

            return (
                <div className={`flex h-screen items-center justify-center ${t.bg} p-4 relative`}>
                    {t.globalLayer}
                    <div className="absolute top-6 right-6 flex items-center gap-3 z-10">
                        <button onClick={toggleTheme} className={`p-2.5 rounded-2xl ${t.subCardBg} border ${t.border} shadow-md hover:scale-110 transition-all ${t.accentText}`} title="Змінити тему">
                            <Icon name="palette" size={18} />
                        </button>
                        <button onClick={logout} className={`flex items-center gap-2 text-sky-100 ${t.subCardBg} px-4 py-2.5 rounded-2xl border ${t.border} shadow-md text-sm font-medium`}>
                            <Icon name="logout" size={16} /> Вийти ({user.email})
                        </button>
                    </div>
                    <div className={`${t.cardBg} p-8 rounded-3xl shadow-2xl border ${t.border} max-w-md w-full relative z-10`}>
                        {t.decorHtml}
                        <div className="relative z-10">
                            <div className="flex justify-center mb-6">
                                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">E</div>
                            </div>
                            <h1 className={`text-2xl font-bold text-center ${t.text} mb-2`}>Робочий простір</h1>
                            <p className="text-center text-sky-200/75 mb-8 text-sm">Створіть новий простір або приєднайтеся за кодом партнера</p>

                            <button onClick={handleCreate} disabled={loading} className={`w-full flex items-center justify-center gap-2 ${t.primary} py-3.5 rounded-2xl font-medium transition-colors mb-6 shadow-md disabled:opacity-50`}>
                                <Icon name="plus" size={20} /> Створити новий простір
                            </button>

                            <div className="relative flex py-4 items-center">
                                <div className={`flex-grow border-t ${t.border}`}></div>
                                <span className="flex-shrink-0 mx-4 text-sky-300/60 text-sm">або</span>
                                <div className={`flex-grow border-t ${t.border}`}></div>
                            </div>

                            <form onSubmit={handleJoin} className="space-y-4">
                                <div>
                                    <label className={`block text-sm font-medium ${t.text} mb-1`}>Код запрошення</label>
                                    <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className={`w-full px-4 py-3.5 ${t.inputBg} border ${t.border} rounded-2xl focus:ring-2 focus:ring-sky-400/30 outline-none uppercase text-center tracking-widest text-lg font-mono`} maxLength={6} />
                                </div>
                                <button type="submit" disabled={loading || !joinCode.trim()} className={`w-full ${t.secondaryBtn} py-3.5 rounded-2xl font-medium transition-colors disabled:opacity-50 shadow-md`}>
                                    Приєднатися
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function DictionaryPanel({ user, fb, workspaceId, words, showToast, t }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    ...formData,
                    addedBy: user.uid,
                    createdAt: Date.now(),
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary');
                    await fb.addDoc(colRef, newWord);
                    setFormData({ en: '', uk: '', example: '' });
                    showToast("Слово збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const handleDelete = async (id) => {
                try {
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', id));
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            const filteredWords = words.filter(w => w.en.toLowerCase().includes(search.toLowerCase()) || w.uk.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className={`flex flex-col h-full bg-transparent relative`}>
                    {t.decorHtml}
                    <div className={`flex-none p-4 md:p-6 bg-transparent border-b ${t.border} relative z-10`}>
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className={`flex-1 px-4 py-2.5 border ${t.border} rounded-2xl outline-none focus:border-sky-300 ${t.inputBg}`} />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className={`flex-1 px-4 py-2.5 border ${t.border} rounded-2xl outline-none focus:border-sky-300 ${t.inputBg}`} />
                                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className={`px-6 py-2.5 ${t.primary} rounded-2xl disabled:opacity-50 flex gap-2 justify-center items-center shadow-md`}>
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className={`w-full px-4 py-2 border ${t.border} rounded-2xl outline-none focus:border-sky-300 text-sm ${t.inputBg}`} />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0 relative z-10">
                        <div className={`p-4 flex-none border-b ${t.border} bg-transparent sticky top-0`}>
                            <div className="relative">
                                <span className="absolute left-3.5 top-3 text-sky-300/60"><Icon name="search" size={16} /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук у спільному словнику..." className={`w-full pl-10 pr-4 py-2.5 ${t.inputBg} border ${t.border} rounded-2xl text-sm outline-none focus:border-sky-300`} />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className="text-center text-sky-200/60 mt-10">Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className={`group ${t.subCardBg} p-4 rounded-2xl border ${t.border} shadow-sm hover:border-sky-300/60 transition-all flex justify-between items-start gap-4`}>
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className={`font-bold text-lg ${t.text}`}>{word.en}</span>
                                                <span className={`${t.accentText} font-medium`}>{word.uk}</span>
                                            </div>
                                            {word.example && <p className="text-sky-200/65 italic text-sm mt-1">"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className="text-sky-300/60 hover:text-red-400 p-2 rounded-xl hover:bg-sky-400/10 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function NotesPanel({ user, fb, workspaceId, publicNotes, privateNotes, showToast, t }) {
            const [activeNote, setActiveNote] = useState(null);
            const [isCreating, setIsCreating] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isShared, setIsShared] = useState(true);

            const allNotes = useMemo(() => [...publicNotes, ...privateNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [publicNotes, privateNotes]);
            const filteredNotes = allNotes.filter(n => n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setIsCreating(false);
                setTitle(note.title);
                setContent(note.content);
                setIsShared(note.isShared);
            };

            const saveNote = async () => {
                if (!title.trim() && !content.trim()) return;
                const noteData = { title: title || 'Без назви', content, updatedAt: Date.now() };

                try {
                    if (activeNote) {
                        if (activeNote.isShared !== isShared) {
                            const oldPath = activeNote.isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.deleteDoc(oldPath);

                            const newCol = isShared 
                                ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                                : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                            const newDoc = await fb.addDoc(newCol, { ...noteData, createdAt: activeNote.createdAt || Date.now() });
                            setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        } else {
                            const ref = isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.updateDoc(ref, noteData);
                            setActiveNote({ ...activeNote, ...noteData });
                        }
                    } else {
                        const col = isShared 
                            ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                            : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                        const newDoc = await fb.addDoc(col, { ...noteData, createdAt: Date.now() });
                        setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        setIsCreating(false);
                    }
                    showToast("Нотатку збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const deleteNote = async (note) => {
                try {
                    const ref = note.isShared 
                        ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', note.id)
                        : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', note.id);
                    await fb.deleteDoc(ref);
                    if (activeNote?.id === note.id) {
                        setActiveNote(null);
                        setIsCreating(false);
                    }
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            return (
                <div className={`flex h-full relative`}>
                    {t.decorHtml}
                    <div className={`w-full md:w-1/3 border-r ${t.border} flex flex-col bg-transparent relative z-10 ${(activeNote || isCreating) ? 'hidden md:flex' : 'flex'}`}>
                        <div className={`p-4 border-b ${t.border}`}>
                            <button onClick={() => { setActiveNote(null); setTitle(''); setContent(''); setIsCreating(true); }} className={`w-full flex items-center justify-center gap-2 ${t.subCardBg} border ${t.border} hover:border-sky-300/70 py-2.5 rounded-2xl text-sm font-semibold shadow-sm transition-all ${t.text}`}>
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className={`p-3 border-b ${t.border} bg-transparent`}>
                            <div className="relative">
                                <span className="absolute left-3.5 top-3 text-sky-300/60"><Icon name="search" size={16} /></span>
                                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className={`w-full pl-10 pr-3 py-2 ${t.inputBg} border ${t.border} rounded-2xl text-sm outline-none focus:border-sky-300`} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3.5 rounded-2xl cursor-pointer border transition-all ${activeNote?.id === note.id ? `${t.primaryLight} border-sky-300 shadow-sm` : `hover:bg-sky-400/10 border-transparent`}`}>
                                    <div className="flex items-center justify-between mb-1">
                                        <h4 className={`font-semibold ${t.text} truncate pr-2`}>{note.title}</h4>
                                        {note.isShared ? <span title="Спільна"><Icon name="users" size={14} className={t.accentText} /></span> : <span title="Особиста"><span className="text-xs bg-sky-950/80 px-2 py-0.5 rounded-xl font-medium text-sky-200 border border-sky-300/30">Особиста</span></span>}
                                    </div>
                                    <p className="text-xs text-sky-200/60 truncate">{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col bg-transparent relative z-10 ${!activeNote && !isCreating && allNotes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && !isCreating && title === '' && content === '') ? (
                            <div className="text-center text-sky-200/60 flex flex-col items-center gap-3">
                                <Icon name="pen" size={48} className="opacity-25" />
                                <p>Оберіть нотатку або створіть нову</p>
                            </div>
                        ) : (
                            <>
                                <div className={`flex items-center justify-between p-4 border-b ${t.border}`}>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setActiveNote(null); setIsCreating(false); }} className="md:hidden text-sky-300"><Icon name="splitClose" className="rotate-180" /></button>
                                        <div className={`flex ${t.navBg} p-1 rounded-2xl border ${t.border}`}>
                                            <button onClick={() => setIsShared(true)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${isShared ? `${t.subCardBg} shadow-md ${t.accentText}` : 'text-sky-200/50'}`}>Спільна</button>
                                            <button onClick={() => setIsShared(false)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${!isShared ? `${t.subCardBg} shadow-md ${t.text}` : 'text-sky-200/50'}`}>Особиста</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {activeNote && <button onClick={() => deleteNote(activeNote)} className="p-2.5 text-sky-300/60 hover:text-red-400 rounded-2xl hover:bg-sky-400/10 transition-colors"><Icon name="trash" size={18} /></button>}
                                        <button onClick={saveNote} className={`flex items-center gap-2 ${t.secondaryBtn} px-4 py-2.5 rounded-2xl text-sm font-semibold transition-colors shadow-md`}><Icon name="save" size={16} /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className={`text-2xl font-bold border-none outline-none mb-4 bg-transparent placeholder:text-sky-200/35 ${t.text}`} />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Почніть писати тут..." className={`flex-1 w-full resize-none border-none outline-none bg-transparent ${t.text} leading-relaxed`} />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function RevisionPanel({ user, fb, workspaceId, words, t }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now).sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0) {
                    if (!currentWord || !dueWords.find(w => w.id === currentWord.id)) {
                        setCurrentWord(dueWords[0]);
                        setShowAnswer(false);
                    }
                } else {
                    setCurrentWord(null);
                }
            }, [dueWords, currentWord]);

            const handleRating = async (quality) => {
                if (!currentWord) return;
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

                try {
                    const wRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', currentWord.id);
                    await fb.updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
                    setCurrentWord(null);
                    setShowAnswer(false);
                } catch (err) {
                    console.error("Review update error", err);
                }
            };

            return (
                <div className={`flex flex-col h-full relative p-6 bg-transparent`}>
                    {t.decorHtml}
                    <h2 className={`text-xl font-bold flex items-center gap-2 mb-6 ${t.text} relative z-10`}><Icon name="brain" className={t.accentText}/> Тренування ({dueWords.length} слів)</h2>
                    <div className="flex-1 flex items-center justify-center relative z-10">
                        {!currentWord ? (
                            <div className={`text-center p-10 ${t.subCardBg} rounded-3xl border ${t.border} shadow-xl max-w-sm w-full`}>
                                <div className="text-sky-300 flex justify-center mb-4"><Icon name="check" size={48}/></div>
                                <h3 className={`text-2xl font-bold mb-2 ${t.text}`}>Відмінно!</h3>
                                <p className="text-sky-200/65">Всі слова на сьогодні повторені.</p>
                            </div>
                        ) : (
                            <div className={`w-full max-w-xl ${t.subCardBg} rounded-3xl border ${t.border} p-10 text-center shadow-2xl`}>
                                <h2 className={`text-5xl font-bold mb-8 ${t.text}`}>{currentWord.en}</h2>
                                {!showAnswer ? (
                                    <button onClick={() => setShowAnswer(true)} className={`w-full py-4 ${t.secondaryBtn} rounded-2xl font-bold transition-transform active:scale-95 shadow-md`}>Показати переклад</button>
                                ) : (
                                    <div className={`border-t ${t.border} pt-8 animate-in fade-in`}>
                                        <h3 className={`text-3xl font-bold ${t.accentText} mb-6`}>{currentWord.uk}</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            <button onClick={() => handleRating(0)} className="py-3 bg-red-950/70 text-red-300 border border-red-900/60 rounded-2xl font-semibold hover:bg-red-900/60 transition-colors shadow-sm">Забув/ла</button>
                                            <button onClick={() => handleRating(3)} className="py-3 bg-sky-950/60 text-sky-200 border border-sky-300/30 rounded-2xl font-semibold hover:bg-sky-900/50 transition-colors shadow-sm">Важко</button>
                                            <button onClick={() => handleRating(4)} className="py-3 bg-sky-950/60 text-sky-200 border border-sky-300/30 rounded-2xl font-semibold hover:bg-sky-900/50 transition-colors shadow-sm">Добре</button>
                                            <button onClick={() => handleRating(5)} className="py-3 bg-sky-500/25 text-sky-100 border border-sky-300/50 rounded-2xl font-semibold hover:bg-sky-500/35 transition-colors shadow-sm">Легко</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsPanel({ user, fb, workspace, showToast, logout, t }) {
            const handleLeave = async () => {
                if (window.confirm("Ви впевнені, що хочете покинути цей простір?")) {
                    try {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspace.id);
                        const newMembers = workspace.members.filter(m => m !== user.uid);
                        await fb.updateDoc(wsRef, { members: newMembers });
                        showToast("Ви покинули простір");
                    } catch (err) {
                        showToast("Помилка");
                    }
                }
            };

            return (
                <div className={`max-w-2xl mx-auto w-full space-y-6 relative`}>
                    {t.decorHtml}
                    <div className="relative z-10 space-y-6">
                        <h2 className={`text-2xl font-bold flex items-center gap-2 ${t.text}`}><Icon name="settings" /> Налаштування та профіль</h2>
                        
                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className={`text-lg font-semibold mb-4 flex items-center gap-2 ${t.text}`}><Icon name="user" className={t.accentText} /> Дані облікового запису Google</h3>
                            <div className="space-y-3 text-sm">
                                <div className="flex items-center gap-3">
                                    {user.photoURL && <img src={user.photoURL} alt="Avatar" className={`w-12 h-12 rounded-2xl border ${t.border} shadow-sm`} />}
                                    <div>
                                        <p className={`font-bold ${t.text} text-base`}>{user.displayName || "Користувач"}</p>
                                        <p className="text-sky-200/65">{user.email}</p>
                                    </div>
                                </div>
                                <div className={`pt-3 border-t ${t.border} flex flex-col gap-1`}>
                                    <span className="text-sky-300/60 text-xs uppercase tracking-wider">Унікальний ID користувача в базі:</span>
                                    <code className={`${t.navBg} px-3.5 py-2 rounded-xl text-xs font-mono text-sky-200/80 select-all border ${t.border}`}>{user.uid}</code>
                                </div>
                            </div>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className={`text-lg font-semibold mb-2 flex items-center gap-2 ${t.text}`}><Icon name="users" className={t.accentText} /> Код запрошення для партнера</h3>
                            <p className="text-sm text-sky-200/65 mb-4">Поділіться цим кодом, щоб підключити другу людину до вашого словника та спільних нотаток у реальному часі.</p>
                            <div className={`flex items-center gap-4 ${t.navBg} p-4 rounded-2xl border ${t.border}`}>
                                <div className={`text-3xl font-mono font-bold tracking-widest ${t.accentText} ${t.subCardBg} px-6 py-2.5 rounded-xl border ${t.border} shadow-sm`}>{workspace.inviteCode}</div>
                                <span className={`text-sm font-bold ${t.primaryLight} px-4 py-1.5 rounded-xl ml-auto border`}>Учасників: {workspace.members?.length || 0}/2</span>
                            </div>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4`}>
                            <div>
                                <h3 className={`text-lg font-semibold mb-1 ${t.text}`}>Вихід із системи</h3>
                                <p className="text-sm text-sky-200/65">Завершити поточну сесію та вийти з аккаунта Google.</p>
                            </div>
                            <button onClick={logout} className={`px-5 py-3 ${t.navBg} hover:opacity-80 ${t.text} rounded-2xl transition-colors font-semibold flex items-center gap-2 shrink-0 border ${t.border} shadow-sm`}>
                                <Icon name="logout" size={16} /> Вийти з аккаунта
                            </button>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className="text-lg font-semibold mb-2 text-red-400">Небезпечна зона</h3>
                            <p className="text-sm text-sky-200/65 mb-4">Вихід з простору збереже ваші особисті нотатки, але ви втратите доступ до спільного словника до повторного входу за кодом.</p>
                            <button onClick={handleLeave} className="px-5 py-3 bg-red-950/60 text-red-300 rounded-2xl border border-red-900/80 hover:bg-red-900/50 transition-colors font-semibold shadow-sm">Покинути простір</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
