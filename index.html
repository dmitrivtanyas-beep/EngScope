<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngSpace - Словник та Нотатки</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel для компіляції JSX в браузері -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Іконки (Мінімалістичний SVG-компонент замість Lucide) ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const paths = {
                book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
                pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
                brain: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>',
                settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
                columns: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="3" y2="21"/>',
                splitClose: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/><path d="m14 9-3 3 3 3"/>',
                search: '<circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/>',
                plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
                trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
                save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
                info: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>',
                check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths[name] }} />
            );
        };

        // --- Логіка інтервального повторення ---
        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);

            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

        // --- Локальне сховище (LocalStorage) ---
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error("Error saving to localStorage", error);
                }
            };
            return [storedValue, setValue];
        };

        // --- Головний компонент ---
        function App() {
            const [words, setWords] = useLocalStorage('engspace_words', []);
            const [notes, setNotes] = useLocalStorage('engspace_notes', []);
            
            const [activeTab, setActiveTab] = useState('dictionary');
            const [isSplitScreen, setIsSplitScreen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* Top Navigation */}
                    <header className="flex-none flex items-center justify-between px-6 py-4 bg-white border-b border-stone-200 shadow-sm z-10">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">E</div>
                            <span className="font-semibold text-lg tracking-tight hidden sm:block">EngSpace</span>
                        </div>

                        <nav className="flex items-center gap-1 sm:gap-2 bg-stone-100 p-1 rounded-xl">
                            <NavBtn icon={<Icon name="book" />} label="Словник" active={activeTab === 'dictionary'} onClick={() => {setActiveTab('dictionary'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="pen" />} label="Нотатки" active={activeTab === 'notes'} onClick={() => {setActiveTab('notes'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="brain" />} label="Повторення" active={activeTab === 'revision'} onClick={() => {setActiveTab('revision'); setIsSplitScreen(false);}} />
                            <NavBtn icon={<Icon name="settings" />} label="Налаштування" active={activeTab === 'settings'} onClick={() => {setActiveTab('settings'); setIsSplitScreen(false);}} />
                        </nav>

                        <button 
                            onClick={() => setIsSplitScreen(!isSplitScreen)}
                            className={`flex items-center gap-2 px-3 py-2 rounded-lg font-medium transition-colors ${isSplitScreen ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-stone-100 text-stone-600'}`}
                        >
                            <Icon name={isSplitScreen ? "splitClose" : "columns"} />
                            <span className="hidden md:block text-sm">{isSplitScreen ? 'Закрити спліт' : 'Спліт-екран'}</span>
                        </button>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 overflow-hidden p-4 sm:p-6">
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            
                            <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'dictionary' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <DictionaryPanel words={words} setWords={setWords} showToast={showToast} />
                            </div>

                            <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'notes' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <NotesPanel notes={notes} setNotes={setNotes} showToast={showToast} />
                            </div>

                            {!isSplitScreen && activeTab === 'revision' && (
                                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                                    <RevisionPanel words={words} setWords={setWords} />
                                </div>
                            )}

                            {!isSplitScreen && activeTab === 'settings' && (
                                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden p-8">
                                    <SettingsPanel setWords={setWords} setNotes={setNotes} showToast={showToast} />
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Toast */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-stone-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 z-50">
                            <Icon name="info" className="text-indigo-400" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick }) => (
            <button
                onClick={onClick}
                className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all ${
                    active ? 'bg-white text-indigo-700 shadow-sm font-medium' : 'text-stone-500 hover:text-stone-800 hover:bg-stone-200/50'
                }`}
            >
                {icon}
                <span className="hidden md:block text-sm">{label}</span>
            </button>
        );

        // --- Компонент Словника ---
        function DictionaryPanel({ words, setWords, showToast }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    id: Date.now().toString(),
                    ...formData,
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                setWords([newWord, ...words]);
                setFormData({ en: '', uk: '', example: '' });
                showToast("Слово збережено");
            };

            const handleDelete = (id) => {
                setWords(words.filter(w => w.id !== id));
                showToast("Видалено");
            };

            const filteredWords = words.filter(w => 
                w.en.toLowerCase().includes(search.toLowerCase()) || 
                w.uk.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="flex flex-col h-full bg-stone-50">
                    <div className="flex-none p-4 md:p-6 bg-white border-b border-stone-200">
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className="flex-1 px-4 py-2 border rounded-lg outline-none focus:border-indigo-500" />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className="flex-1 px-4 py-2 border rounded-lg outline-none focus:border-indigo-500" />
                                <button type="submit" className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex gap-2 justify-center items-center">
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className="w-full px-4 py-2 border rounded-lg outline-none focus:border-indigo-500 text-sm" />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0">
                        <div className="p-4 flex-none border-b border-stone-200 bg-white sticky top-0">
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-stone-400"><Icon name="search" /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук..." className="w-full pl-10 pr-4 py-2 border rounded-lg text-sm outline-none focus:border-indigo-400" />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className="text-center text-stone-400 mt-10">Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className="group bg-white p-4 rounded-xl border shadow-sm flex justify-between items-start gap-4">
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className="font-bold text-lg text-stone-900">{word.en}</span>
                                                <span className="text-indigo-600 font-medium">{word.uk}</span>
                                            </div>
                                            {word.example && <p className="text-stone-600 italic text-sm mt-1">"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className="text-stone-300 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 shrink-0">
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Компонент Нотаток ---
        function NotesPanel({ notes, setNotes, showToast }) {
            const [activeNote, setActiveNote] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');

            const filteredNotes = notes.filter(n => n.title.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setTitle(note.title);
                setContent(note.content);
            };

            const saveNote = () => {
                if (!title.trim() && !content.trim()) return;
                
                if (activeNote) {
                    setNotes(notes.map(n => n.id === activeNote.id ? { ...n, title: title || 'Без назви', content, updatedAt: Date.now() } : n));
                } else {
                    const newNote = { id: Date.now().toString(), title: title || 'Без назви', content, updatedAt: Date.now() };
                    setNotes([newNote, ...notes]);
                    setActiveNote(newNote);
                }
                showToast("Нотатку збережено");
            };

            const deleteNote = (id) => {
                setNotes(notes.filter(n => n.id !== id));
                if (activeNote?.id === id) setActiveNote(null);
                showToast("Видалено");
            };

            return (
                <div className="flex h-full">
                    <div className={`w-full md:w-1/3 border-r flex flex-col bg-stone-50 ${activeNote ? 'hidden md:flex' : 'flex'}`}>
                        <div className="p-4 border-b">
                            <button onClick={() => {setActiveNote(null); setTitle(''); setContent('');}} className="w-full flex items-center justify-center gap-2 bg-white border hover:border-indigo-400 py-2 rounded-xl text-sm font-medium">
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3 rounded-xl cursor-pointer ${activeNote?.id === note.id ? 'bg-indigo-50 border-indigo-200 border' : 'hover:bg-stone-100 border border-transparent'}`}>
                                    <h4 className="font-medium truncate">{note.title}</h4>
                                    <p className="text-xs text-stone-500 truncate">{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col bg-white ${!activeNote && notes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && title === '' && content === '') ? (
                            <div className="text-center text-stone-400">Оберіть нотатку або створіть нову</div>
                        ) : (
                            <>
                                <div className="flex items-center justify-between p-4 border-b">
                                    <button onClick={() => setActiveNote(null)} className="md:hidden text-stone-500"><Icon name="splitClose" className="rotate-180" /></button>
                                    <div className="flex gap-2 ml-auto">
                                        {activeNote && <button onClick={() => deleteNote(activeNote.id)} className="p-2 text-stone-400 hover:text-red-600"><Icon name="trash" /></button>}
                                        <button onClick={saveNote} className="flex gap-2 bg-stone-800 text-white px-4 py-2 rounded-lg text-sm"><Icon name="save" /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className="text-2xl font-bold border-none outline-none mb-4" />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Пишіть тут..." className="flex-1 w-full resize-none border-none outline-none" />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // --- Компонент Повторення (Картки) ---
        function RevisionPanel({ words, setWords }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now)
                            .sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0 && !currentWord) setCurrentWord(dueWords[0]);
                else if (dueWords.length === 0) setCurrentWord(null);
            }, [dueWords]);

            const handleRating = (quality) => {
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(
                    quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor
                );

                setWords(words.map(w => w.id === currentWord.id ? { ...w, repetitions, interval, easeFactor, nextReviewDate } : w));
                setShowAnswer(false);
                setCurrentWord(dueWords.length > 1 ? dueWords[1] : null);
            };

            return (
                <div className="flex flex-col h-full relative p-6">
                    <h2 className="text-xl font-bold flex gap-2 mb-6"><Icon name="brain" className="text-indigo-600"/> Тренування ({dueWords.length} слів)</h2>
                    
                    <div className="flex-1 flex items-center justify-center">
                        {!currentWord ? (
                            <div className="text-center p-10 bg-white rounded-3xl border shadow-sm">
                                <div className="text-green-500 flex justify-center mb-4"><Icon name="check" size={48}/></div>
                                <h3 className="text-2xl font-bold mb-2">Відмінно!</h3>
                                <p className="text-stone-500">Всі слова на сьогодні повторені.</p>
                            </div>
                        ) : (
                            <div className="w-full max-w-xl bg-white rounded-3xl border p-10 text-center shadow-lg">
                                <h2 className="text-5xl font-bold mb-8">{currentWord.en}</h2>
                                {!showAnswer ? (
                                    <button onClick={() => setShowAnswer(true)} className="w-full py-4 bg-stone-100 rounded-xl font-semibold hover:bg-stone-200">Показати переклад</button>
                                ) : (
                                    <div className="border-t pt-8">
                                        <h3 className="text-3xl font-bold text-indigo-700 mb-6">{currentWord.uk}</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            <button onClick={() => handleRating(0)} className="py-2 bg-red-100 text-red-700 rounded-lg">Збув/ла</button>
                                            <button onClick={() => handleRating(3)} className="py-2 bg-orange-100 text-orange-700 rounded-lg">Важко</button>
                                            <button onClick={() => handleRating(4)} className="py-2 bg-blue-100 text-blue-700 rounded-lg">Добре</button>
                                            <button onClick={() => handleRating(5)} className="py-2 bg-green-100 text-green-700 rounded-lg">Легко</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Налаштування ---
        function SettingsPanel({ setWords, setNotes, showToast }) {
            const handleClear = () => {
                if(window.confirm("УВАГА! Це назавжди видалить усі ваші слова та нотатки з браузера. Продовжити?")) {
                    setWords([]);
                    setNotes([]);
                    showToast("Всі дані очищено");
                }
            };

            return (
                <div className="max-w-2xl mx-auto w-full">
                    <h2 className="text-2xl font-bold mb-8">Налаштування (Локальна версія)</h2>
                    <div className="bg-white border rounded-xl p-6 mb-6">
                        <h3 className="text-lg font-semibold mb-2">Про зберігання даних</h3>
                        <p className="text-sm text-stone-500 mb-4">Ця версія зберігає ваші дані локально у браузері. Якщо ви очистите кеш браузера або зайдете з іншого пристрою, дані будуть недоступні.</p>
                        <button onClick={handleClear} className="px-4 py-2 bg-red-50 text-red-600 rounded-lg border border-red-200 hover:bg-red-100">
                            Очистити всі локальні дані
                        </button>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
