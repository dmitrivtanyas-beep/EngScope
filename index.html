    <style>
        /* Стилі для теми Abyss Ocean (Glassmorphism) */
        .abyss-bg {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, 
                #010409 0%, 
                #031329 18%, 
                #051d3b 38%, 
                #031226 62%, 
                #020c1b 82%, 
                #04182e 100%
            );
        }

        .abyss-ray-core {
            background: radial-gradient(ellipse at 50% 0%, 
                rgba(186, 230, 253, 0.45) 0%, 
                rgba(56, 189, 248, 0.22) 32%, 
                rgba(14, 165, 233, 0.06) 60%, 
                transparent 80%
            );
            filter: blur(28px);
            animation: rayPulse 9s ease-in-out infinite;
        }

        .abyss-ray-beam {
            background: conic-gradient(from 165deg at 50% 0%, 
                transparent 0deg, 
                rgba(125, 211, 252, 0.2) 12deg, 
                rgba(224, 242, 254, 0.28) 18deg, 
                rgba(56, 189, 248, 0.12) 26deg, 
                transparent 38deg
            );
            filter: blur(18px);
            opacity: 0.85;
            animation: beamSway 12s ease-in-out infinite alternate;
        }

        @keyframes rayPulse {
            0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        @keyframes beamSway {
            0% { transform: translateX(-52%) rotate(-2deg); }
            100% { transform: translateX(-48%) rotate(2deg); }
        }

        .jellyfish-float {
            animation: jellyDrift 7s ease-in-out infinite;
            filter: drop-shadow(0 0 24px rgba(56, 189, 248, 0.55));
        }

        .jellyfish-float-delayed {
            animation: jellyDriftAlt 9s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(103, 232, 249, 0.45));
        }

        @keyframes jellyDrift {
            0%, 100% { transform: translateY(0px) rotate(-4deg); }
            50% { transform: translateY(-18px) rotate(3deg); }
        }

        @keyframes jellyDriftAlt {
            0%, 100% { transform: translateY(0px) rotate(5deg) scale(0.96); }
            50% { transform: translateY(-22px) rotate(-3deg) scale(1.03); }
        }

        .plankton-dot {
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(224, 242, 254, 0.95) 0%, rgba(56, 189, 248, 0.3) 60%, transparent 100%);
            pointer-events: none;
            animation: floatPlankton linear infinite;
        }

        @keyframes floatPlankton {
            0% { transform: translateY(0px) translateX(0px); opacity: 0; }
            20% { opacity: 0.85; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-140px) translateX(25px); opacity: 0; }
        }

        .abyss-glass-panel {
            background: linear-gradient(145deg, 
                rgba(15, 42, 78, 0.48) 0%, 
                rgba(5, 19, 38, 0.72) 55%, 
                rgba(8, 28, 56, 0.58) 100%
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(147, 210, 255, 0.32);
            box-shadow: 
                0 20px 50px rgba(0, 4, 12, 0.75),
                0 0 35px rgba(56, 189, 248, 0.14),
                inset 0 1px 1px rgba(224, 242, 254, 0.35),
                inset 0 -1px 1px rgba(56, 189, 248, 0.15);
        }

        .abyss-sub-card {
            background: linear-gradient(180deg, rgba(16, 52, 94, 0.45) 0%, rgba(4, 16, 34, 0.78) 100%);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(186, 230, 253, 0.28);
            box-shadow: 0 10px 25px rgba(0, 5, 15, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, 
                #010409 0%, 
                #031329 18%, 
                #051d3b 38%, 
                #031226 62%, 
                #020c1b 82%, 
                #04182e 100%

                rgba(15, 42, 78, 0.14) 0%, 
                rgba(5, 19, 38, 0.22) 55%,

        .win98-titlebar {

        .dollhouse-logo {

                 1.5px  1.5px 0 #ffb3e0,
                 0px  3px 0 #1f1b24;
            line-height: 0.92;
        }

        .cd-disc {
            background: conic-gradient(
                from 45deg,
                #e0e7ff,
                #f9a8d4,
                #fde68a,
                #a7f3d0,
                #bae6fd,
                #ddd6fe,
                #fbcfe8,
                #e0e7ff
            );
            border: 2px solid #1f1b24;
            border-radius: 50%;
            position: relative;
            box-shadow: 3px 4px 0px rgba(31,27,36,0.25);
            animation: spinSlow 14s linear infinite;
        }
        .cd-disc::before {
            content: '';
            position: absolute;
            inset: 31%;
            border-radius: 50%;
            background: rgba(255,255,255,0.82);
            border: 1.5px solid #1f1b24;
        }
        .cd-disc::after {
            content: '';
            position: absolute;
            inset: 41%;
            border-radius: 50%;
            background: #fff8fc;
            border: 1.5px solid #1f1b24;
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .checkerboard-strip {
            background-image: 
                linear-gradient(45deg, #1f1b24 25%, transparent 25%), 
                linear-gradient(-45deg, #1f1b24 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1f1b24 75%),

        .sticky-note {
            background: #fef6a8;
            border: 1.5px solid #1f1b24;
            box-shadow: 3px 4px 0px rgba(31, 27, 36, 0.25);
            position: relative;
        }
        .sticky-note::after {
            content: '';
            position: absolute;
            bottom: -1.5px;
            right: -1.5px;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #e5dc7a 45%, #1f1b24 46%, #1f1b24 52%, #fff8fc 53%);
        }

        .cyber-subcard:hover {
            border-color: #00ff66;

            box-shadow: 3px 3px 0px #181818;

        .cyber-btn-green:active {

        .cyber-btn-pink:hover {

            right: -9px;
            border-left: 2px solid rgba(255, 255, 255, 0.35);
        }

        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);
            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

            const loginWithGoogle = async () => {
                if (!fb) {
                    showToast("Firebase ще завантажується.");
                    return;
                }

                const provider = new fb.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: "select_account" });

                try {
                    await fb.signInWithPopup(fb.auth, provider);
                } catch (err) {
                    console.error("Повна помилка входу:", err);
                    alert("Помилка входу: " + err.code + " - " + err.message);
                }
            };

                if (!fb) return;
                await fb.signOut(fb.auth);
                setUser(null);
                setActiveWorkspace(null);
            };

            useEffect(() => {
                if (!user || !fb) return;
                const wRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                const unsub = fb.onSnapshot(wRef, (snap) => {
                    const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setWorkspaces(allWs);
                    const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
                    setActiveWorkspace(myWs || null);
                }, (err) => console.error("Workspaces error:", err));
                return () => unsub();
            }, [user, fb]);

        }

        const NavBtn = ({ icon, label, active, onClick, t }) => {
            const isSharp = t.id === 'dollhouse' || t.id === 'cyberQuiz';
            return (
                <button onClick={onClick} className={`flex items-center gap-2 px-3.5 py-2 ${isSharp ? 'rounded-none' : 'rounded-xl'} transition-all ${active ? `${t.subCardBg} ${t.accentText} shadow-md font-bold ${isSharp ? '' : 'scale-105'} border ${t.border}` : t.navInactive}`}>

                    <span className="hidden md:block text-sm">{label}</span>
                </button>
            );
        };

        function WorkspaceSetup({ user, fb, workspaces, showToast, logout, t, toggleTheme }) {
            const [joinCode, setJoinCode] = useState('');
            const [loading, setLoading] = useState(false);
            const isDollhouse = t.id === 'dollhouse';
            const isCyberQuiz = t.id === 'cyberQuiz';

            const handleCreate = async () => {
                setLoading(true);
                try {
                    const code = generateInviteCode();
                    const wsRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                    await fb.addDoc(wsRef, {
                        inviteCode: code,
                        members: [user.uid],
                        createdAt: Date.now()
                    });
                    showToast("Простір створено!");
                } catch (err) {
                    showToast("Помилка створення простору");
                }
                setLoading(false);
            };

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!joinCode.trim()) return;
                setLoading(true);
                try {
                    const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
                    if (!wsToJoin) {
                        showToast("Код не знайдено");
                    } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
                        showToast("Робочий простір вже має двох учасників");
                    } else {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', wsToJoin.id);
                        const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
                        await fb.updateDoc(wsRef, { members: updatedMembers });
                        showToast("Успішно приєднано!");
                    }
                } catch (err) {
                    showToast("Помилка приєднання");
                }
                setLoading(false);
            };

            return (
                <div className={`flex h-screen items-center justify-center ${t.bg} p-4 relative`}>
                    {t.globalLayer}
                    <div className="absolute top-6 right-6 flex items-center gap-3 z-10">
                        <button onClick={toggleTheme} className={`p-2.5 rounded-2xl ${t.subCardBg} border ${t.border} shadow-md hover:scale-110 transition-all ${t.accentText}`} title="Змінити тему">
                            <Icon name="palette" size={18} />
                        </button>
                        <button onClick={logout} className={`flex items-center gap-2 ${t.text} ${t.subCardBg} px-4 py-2.5 rounded-2xl border ${t.border} shadow-md text-sm font-medium`}>
                            <Icon name="logout" size={16} /> Вийти ({user.email})
                        </button>
                    </div>
                    <div className={`${t.cardBg} ${isDollhouse ? 'p-0' : 'p-8'} rounded-3xl shadow-2xl border ${t.border} max-w-md w-full relative z-10`}>
                        {isDollhouse && <Win98WindowBar title="workspace_setup.exe" variant="titlebar-periwinkle" icon="☾" />}
                        {t.decorHtml}
                        <div className={`relative z-10 ${isDollhouse ? 'p-8' : ''}`}>
                            <div className="flex justify-center mb-6">
                                {isDollhouse ? (
                                    <div className="dollhouse-logo text-3xl transform -rotate-2">engspace</div>
                                ) : isCyberQuiz ? (
                                    <div className="bg-white text-black font-bold text-xs py-1.5 px-4 tracking-wide border border-black shadow-[4px_4px_0_#00ff66]">
                                        EVENT 01 &gt;&gt; WORKSPACE SETUP
                                    </div>
                                ) : (
                                    <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">E</div>
                                )}
                            </div>
                            <h1 className={`text-2xl font-bold text-center ${t.text} mb-2 ${isDollhouse ? 'font-pixel text-lg' : ''}`}>Робочий простір</h1>
                            <p className={`text-center ${t.mutedText} mb-8 text-sm`}>Створіть новий простір або приєднайтеся за кодом партнера</p>

                            <button onClick={handleCreate} disabled={loading} className={`w-full flex items-center justify-center gap-2 ${t.primary} py-3.5 rounded-2xl font-medium transition-colors mb-6 shadow-md disabled:opacity-50`}>
                                <Icon name="plus" size={20} /> Створити новий простір
                            </button>

                            <div className="relative flex py-4 items-center">
                                <div className={`flex-grow border-t ${t.border}`}></div>
                                <span className={`flex-shrink-0 mx-4 ${t.subtleText} text-sm`}>або</span>
                                <div className={`flex-grow border-t ${t.border}`}></div>
                            </div>

                            <form onSubmit={handleJoin} className="space-y-4">
                                <div>
                                    <label className={`block text-sm font-medium ${t.text} mb-1`}>Код запрошення</label>
                                    <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className={`w-full px-4 py-3.5 ${t.inputBg} border ${t.border} rounded-2xl focus:ring-2 focus:ring-sky-400/30 outline-none uppercase text-center tracking-widest text-lg font-mono`} maxLength={6} />
                                </div>
                                <button type="submit" disabled={loading || !joinCode.trim()} className={`w-full ${t.secondaryBtn} py-3.5 rounded-2xl font-medium transition-colors disabled:opacity-50 shadow-md`}>
                                    Приєднатися
                                </button>
                            </form>
                        </div>
                    </div>
                    {isDollhouse && <DollhouseTaskbar activeTab="settings" onQuickSwitch={() => {}} showToast={showToast} />}
                </div>
            );
        }

        function DictionaryPanel({ user, fb, workspaceId, words, showToast, t }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    ...formData,
                    addedBy: user.uid,
                    createdAt: Date.now(),
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary');
                    await fb.addDoc(colRef, newWord);
                    setFormData({ en: '', uk: '', example: '' });
                    showToast("Слово збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const handleDelete = async (id) => {
                try {
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', id));
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            const filteredWords = words.filter(w => w.en.toLowerCase().includes(search.toLowerCase()) || w.uk.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className={`flex flex-col flex-1 min-h-0 bg-transparent relative`}>
                    {t.decorHtml}
                    <div className={`flex-none p-4 md:p-6 bg-transparent border-b ${t.border} relative z-10`}>
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className={`flex-1 px-4 py-2.5 border ${t.border} rounded-2xl outline-none ${t.inputBg}`} />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className={`flex-1 px-4 py-2.5 border ${t.border} rounded-2xl outline-none ${t.inputBg}`} />
                                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className={`px-6 py-2.5 ${t.primary} rounded-2xl disabled:opacity-50 flex gap-2 justify-center items-center shadow-md`}>
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className={`w-full px-4 py-2 border ${t.border} rounded-2xl outline-none text-sm ${t.inputBg}`} />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0 relative z-10">
                        <div className={`p-4 flex-none border-b ${t.border} bg-transparent sticky top-0`}>
                            <div className="relative">
                                <span className={`absolute left-3.5 top-3 ${t.subtleText}`}><Icon name="search" size={16} /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук у спільному словнику..." className={`w-full pl-10 pr-4 py-2.5 ${t.inputBg} border ${t.border} rounded-2xl text-sm outline-none`} />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className={`text-center ${t.mutedText} mt-10`}>Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className={`group ${t.subCardBg} p-4 rounded-2xl border ${t.border} shadow-sm transition-all flex justify-between items-start gap-4`}>
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className={`font-bold text-lg ${t.text}`}>{word.en}</span>
                                                <span className={`${t.accentText} font-medium`}>{word.uk}</span>
                                            </div>
                                            {word.example && <p className={`${t.mutedText} italic text-sm mt-1`}>"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className={`${t.trashBtn} p-2 rounded-xl shrink-0 opacity-0 group-hover:opacity-100 transition-opacity`}>
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function NotesPanel({ user, fb, workspaceId, publicNotes, privateNotes, showToast, t }) {
            const [activeNote, setActiveNote] = useState(null);
            const [isCreating, setIsCreating] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isShared, setIsShared] = useState(true);

            const allNotes = useMemo(() => [...publicNotes, ...privateNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [publicNotes, privateNotes]);
            const filteredNotes = allNotes.filter(n => n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setIsCreating(false);
                setTitle(note.title);
                setContent(note.content);
                setIsShared(note.isShared);
            };

            const saveNote = async () => {
                if (!title.trim() && !content.trim()) return;
                const noteData = { title: title || 'Без назви', content, updatedAt: Date.now() };

                try {
                    if (activeNote) {
                        if (activeNote.isShared !== isShared) {
                            const oldPath = activeNote.isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.deleteDoc(oldPath);

                            const newCol = isShared 
                                ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                                : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                            const newDoc = await fb.addDoc(newCol, { ...noteData, createdAt: activeNote.createdAt || Date.now() });
                            setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        } else {
                            const ref = isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.updateDoc(ref, noteData);
                            setActiveNote({ ...activeNote, ...noteData });
                        }
                    } else {
                        const col = isShared 
                            ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                            : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                        const newDoc = await fb.addDoc(col, { ...noteData, createdAt: Date.now() });
                        setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        setIsCreating(false);
                    }
                    showToast("Нотатку збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const deleteNote = async (note) => {
                try {
                    const ref = note.isShared 
                        ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', note.id)
                        : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', note.id);
                    await fb.deleteDoc(ref);
                    if (activeNote?.id === note.id) {
                        setActiveNote(null);
                        setIsCreating(false);
                    }
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            return (
                <div className={`flex flex-1 min-h-0 relative`}>
                    {t.decorHtml}
                    <div className={`w-full md:w-1/3 border-r ${t.border} flex flex-col bg-transparent relative z-10 ${(activeNote || isCreating) ? 'hidden md:flex' : 'flex'}`}>
                        <div className={`p-4 border-b ${t.border}`}>
                            <button onClick={() => { setActiveNote(null); setTitle(''); setContent(''); setIsCreating(true); }} className={`w-full flex items-center justify-center gap-2 ${t.subCardBg} border ${t.border} hover:opacity-90 py-2.5 rounded-2xl text-sm font-semibold shadow-sm transition-all ${t.text}`}>
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className={`p-3 border-b ${t.border} bg-transparent`}>
                            <div className="relative">
                                <span className={`absolute left-3.5 top-3 ${t.subtleText}`}><Icon name="search" size={16} /></span>
                                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className={`w-full pl-10 pr-3 py-2 ${t.inputBg} border ${t.border} rounded-2xl text-sm outline-none`} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1.5">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3.5 rounded-2xl cursor-pointer border transition-all ${activeNote?.id === note.id ? `${t.primaryLight} shadow-sm` : `hover:opacity-85 border-transparent`}`}>
                                    <div className="flex items-center justify-between mb-1">
                                        <h4 className={`font-semibold ${t.text} truncate pr-2`}>{note.title}</h4>
                                        {note.isShared ? <span title="Спільна"><Icon name="users" size={14} className={t.accentText} /></span> : <span title="Особиста"><span className={`text-xs ${t.badgeBg} px-2 py-0.5 rounded-xl font-medium border`}>Особиста</span></span>}
                                    </div>
                                    <p className={`text-xs ${t.mutedText} truncate`}>{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col bg-transparent relative z-10 ${!activeNote && !isCreating && allNotes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && !isCreating && title === '' && content === '') ? (
                            <div className={`text-center ${t.mutedText} flex flex-col items-center gap-3`}>
                                <Icon name="pen" size={48} className="opacity-35" />
                                <p>Оберіть нотатку або створіть нову</p>
                            </div>
                        ) : (
                            <>
                                <div className={`flex items-center justify-between p-4 border-b ${t.border}`}>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setActiveNote(null); setIsCreating(false); }} className={`md:hidden ${t.accentText}`}><Icon name="splitClose" className="rotate-180" /></button>
                                        <div className={`flex ${t.navBg} p-1 rounded-2xl border ${t.border}`}>
                                            <button onClick={() => setIsShared(true)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${isShared ? `${t.subCardBg} shadow-md ${t.accentText}` : t.mutedText}`}>Спільна</button>
                                            <button onClick={() => setIsShared(false)} className={`px-3.5 py-1.5 rounded-xl text-sm font-semibold transition-all ${!isShared ? `${t.subCardBg} shadow-md ${t.text}` : t.mutedText}`}>Особиста</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {activeNote && <button onClick={() => deleteNote(activeNote)} className={`p-2.5 ${t.trashBtn} rounded-2xl transition-colors`}><Icon name="trash" size={18} /></button>}
                                        <button onClick={saveNote} className={`flex items-center gap-2 ${t.secondaryBtn} px-4 py-2.5 rounded-2xl text-sm font-semibold transition-colors shadow-md`}><Icon name="save" size={16} /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className={`text-2xl font-bold border-none outline-none mb-4 bg-transparent ${t.text}`} />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Почніть писати тут..." className={`flex-1 w-full resize-none border-none outline-none bg-transparent ${t.text} leading-relaxed`} />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function RevisionPanel({ user, fb, workspaceId, words, t }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now).sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0) {
                    if (!currentWord || !dueWords.find(w => w.id === currentWord.id)) {
                        setCurrentWord(dueWords[0]);
                        setShowAnswer(false);
                    }
                } else {
                    setCurrentWord(null);
                }
            }, [dueWords, currentWord]);

            const handleRating = async (quality) => {
                if (!currentWord) return;
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

                try {
                    const wRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', currentWord.id);
                    await fb.updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
                    setCurrentWord(null);
                    setShowAnswer(false);
                } catch (err) {
                    console.error("Review update error", err);
                }
            };

            const isOceanDark = t.id === 'abyssOcean' || t.id === 'deepOcean';
            const isDollhouse = t.id === 'dollhouse';
            const isCyberQuiz = t.id === 'cyberQuiz';

            return (
                <div className={`flex flex-col flex-1 min-h-0 relative p-6 bg-transparent`}>
                    {t.decorHtml}
                    <h2 className={`text-xl font-bold flex items-center gap-2 mb-6 ${t.text} relative z-10`}><Icon name="brain" className={t.accentText}/> Тренування ({dueWords.length} слів)</h2>
                    <div className="flex-1 flex items-center justify-center relative z-10">
                        {!currentWord ? (
                            <div className={`text-center p-10 ${t.subCardBg} rounded-3xl border ${t.border} shadow-xl max-w-sm w-full`}>
                                <div className={`${t.accentText} flex justify-center mb-4`}><Icon name="check" size={48}/></div>
                                <h3 className={`text-2xl font-bold mb-2 ${t.text}`}>Відмінно!</h3>
                                <p className={t.mutedText}>Всі слова на сьогодні повторені.</p>
                            </div>
                        ) : (
                            <div className={`w-full max-w-xl ${t.subCardBg} rounded-3xl border ${t.border} p-10 text-center shadow-2xl`}>
                                <h2 className={`text-5xl font-bold mb-8 ${t.text}`}>{currentWord.en}</h2>
                                {!showAnswer ? (
                                    <button onClick={() => setShowAnswer(true)} className={`w-full py-4 ${t.secondaryBtn} rounded-2xl font-bold transition-transform active:scale-95 shadow-md`}>Показати переклад</button>
                                ) : (
                                    <div className={`border-t ${t.border} pt-8 animate-in fade-in`}>
                                        <h3 className={`text-3xl font-bold ${t.accentText} mb-6`}>{currentWord.uk}</h3>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                            <button onClick={() => handleRating(0)} className={`py-3 ${isDollhouse ? 'y2k-btn rounded-none bg-[#ff94d2] text-[#1f1b24]' : (isCyberQuiz ? 'rounded-none bg-[#ff007f] text-white border-[#ff007f] hover:opacity-85' : 'rounded-2xl')} font-semibold transition-colors shadow-sm border ${isOceanDark ? 'bg-red-950/70 text-red-300 border-red-900/60 hover:bg-red-900/60' : (!isDollhouse && !isCyberQuiz ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' : '')}`}>Забув/ла</button>
                                            <button onClick={() => handleRating(3)} className={`py-3 ${isDollhouse ? 'y2k-btn rounded-none bg-[#ffe66d] text-[#1f1b24]' : (isCyberQuiz ? 'rounded-none bg-[#181818] text-yellow-300 border-yellow-400/70 hover:bg-yellow-400/10' : 'rounded-2xl')} font-semibold transition-colors shadow-sm border ${isOceanDark ? 'bg-sky-950/60 text-sky-200 border-sky-300/30 hover:bg-sky-900/50' : (!isDollhouse && !isCyberQuiz ? 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100' : '')}`}>Важко</button>
                                            <button onClick={() => handleRating(4)} className={`py-3 ${isDollhouse ? 'y2k-btn rounded-none bg-[#b8d4ff] text-[#1f1b24]' : (isCyberQuiz ? 'rounded-none bg-[#181818] text-white border-white/60 hover:bg-white/10' : 'rounded-2xl')} font-semibold transition-colors shadow-sm border ${isOceanDark ? 'bg-sky-950/60 text-sky-200 border-sky-300/30 hover:bg-sky-900/50' : (!isDollhouse && !isCyberQuiz ? 'bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100' : '')}`}>Добре</button>
                                            <button onClick={() => handleRating(5)} className={`py-3 ${isDollhouse ? 'y2k-btn rounded-none bg-[#a7f3d0] text-[#1f1b24]' : (isCyberQuiz ? 'rounded-none bg-[#00ff66] text-black border-[#00ff66] hover:bg-[#00cc52]' : 'rounded-2xl')} font-semibold transition-colors shadow-sm border ${isOceanDark ? 'bg-sky-500/25 text-sky-100 border-sky-300/50 hover:bg-sky-500/35' : (!isDollhouse && !isCyberQuiz ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' : '')}`}>Легко</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function SettingsPanel({ user, fb, workspace, showToast, logout, t }) {
            const handleLeave = async () => {
                if (window.confirm("Ви впевнені, що хочете покинути цей простір?")) {
                    try {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspace.id);
                        const newMembers = workspace.members.filter(m => m !== user.uid);
                        await fb.updateDoc(wsRef, { members: newMembers });
                        showToast("Ви покинули простір");
                    } catch (err) {
                        showToast("Помилка");
                    }
                }
            };

            const isOceanDark = t.id === 'abyssOcean' || t.id === 'deepOcean';
            const isDollhouse = t.id === 'dollhouse';
            const isCyberQuiz = t.id === 'cyberQuiz';

            return (
                <div className={`max-w-2xl mx-auto w-full space-y-6 relative`}>
                    {t.decorHtml}
                    <div className="relative z-10 space-y-6">
                        <div className="flex items-center justify-between gap-4">
                            <h2 className={`text-2xl font-bold flex items-center gap-2 ${t.text}`}><Icon name="settings" /> Налаштування та профіль</h2>
                            {isDollhouse && <MiniTamagotchi />}
                        </div>
                        
                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className={`text-lg font-semibold mb-4 flex items-center gap-2 ${t.text}`}><Icon name="user" className={t.accentText} /> Дані облікового запису Google</h3>
                            <div className="space-y-3 text-sm">
                                <div className="flex items-center gap-3">
                                    {user.photoURL && <img src={user.photoURL} alt="Avatar" className={`w-12 h-12 rounded-2xl border ${t.border} shadow-sm`} />}
                                    <div>
                                        <p className={`font-bold ${t.text} text-base`}>{user.displayName || "Користувач"}</p>
                                        <p className={t.mutedText}>{user.email}</p>
                                    </div>
                                </div>
                                <div className={`pt-3 border-t ${t.border} flex flex-col gap-1`}>
                                    <span className={`${t.subtleText} text-xs uppercase tracking-wider`}>Унікальний ID користувача в базі:</span>
                                    <code className={`${t.navBg} px-3.5 py-2 rounded-xl text-xs font-mono ${t.mutedText} select-all border ${t.border}`}>{user.uid}</code>
                                </div>
                            </div>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className={`text-lg font-semibold mb-2 flex items-center gap-2 ${t.text}`}><Icon name="users" className={t.accentText} /> Код запрошення для партнера</h3>
                            <p className={`text-sm ${t.mutedText} mb-4`}>Поділіться цим кодом, щоб підключити другу людину до вашого словника та спільних нотаток у реальному часі.</p>
                            <div className={`flex items-center gap-4 ${t.navBg} p-4 rounded-2xl border ${t.border}`}>
                                <div className={`${isCyberQuiz ? 'coupon-box coupon-notch-left coupon-notch-right' : `${t.subCardBg} border ${t.border}`} text-3xl font-mono font-bold tracking-widest ${t.accentText} px-6 py-2.5 rounded-xl shadow-sm`}>{workspace.inviteCode}</div>
                                <span className={`text-sm font-bold ${t.primaryLight} px-4 py-1.5 rounded-xl ml-auto border`}>Учасників: {workspace.members?.length || 0}/2</span>
                            </div>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4`}>
                            <div>
                                <h3 className={`text-lg font-semibold mb-1 ${t.text}`}>Вихід із системи</h3>
                                <p className={`text-sm ${t.mutedText}`}>Завершити поточну сесію та вийти з аккаунта Google.</p>
                            </div>
                            <button onClick={logout} className={`px-5 py-3 ${t.navBg} hover:opacity-80 ${t.text} rounded-2xl transition-colors font-semibold flex items-center gap-2 shrink-0 border ${t.border} shadow-sm`}>
                                <Icon name="logout" size={16} /> Вийти з аккаунта
                            </button>
                        </div>

                        <div className={`${t.subCardBg} border ${t.border} rounded-3xl p-6 shadow-md`}>
                            <h3 className={`text-lg font-semibold mb-2 ${isOceanDark ? 'text-red-400' : (isCyberQuiz ? 'text-[#ff007f]' : 'text-red-600')}`}>Небезпечна зона</h3>
                            <p className={`text-sm ${t.mutedText} mb-4`}>Вихід з простору збереже ваші особисті нотатки, але ви втратите доступ до спільного словника до повторного входу за кодом.</p>
                            <button onClick={handleLeave} className={`px-5 py-3 ${isDollhouse ? 'y2k-btn rounded-none bg-[#ff94d2] text-[#1f1b24]' : (isCyberQuiz ? 'cyber-btn-pink rounded-none' : 'rounded-2xl')} border transition-colors font-semibold shadow-sm ${isOceanDark ? 'bg-red-950/60 text-red-300 border-red-900/80 hover:bg-red-900/50' : (!isDollhouse && !isCyberQuiz ? 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100' : '')}`}>Покинути простір</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
