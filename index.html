<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngSpace - Парний простір для вивчення англійської</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans transition-colors duration-300">
    <div id="root"></div>

    <!-- Firebase SDKs (v10 modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Конфігурація Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyBtohoKon-Q9CB0qXoa6XlufqcsRpYFPHo",
          authDomain: "engscope-7ae3c.firebaseapp.com",
          projectId: "engscope-7ae3c",
          storageBucket: "engscope-7ae3c.firebasestorage.app",
          messagingSenderId: "602537995169",
          appId: "1:602537995169:web:e3cc995338dd50dfa9f9e0",
          measurementId: "G-TVD7HHYZ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "engspace-main-space";

        window.firebaseApp = { 
            auth, 
            db, 
            appId, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged, 
            signOut, 
            collection, 
            onSnapshot, 
            doc, 
            setDoc, 
            updateDoc, 
            deleteDoc, 
            addDoc, 
            getDoc 
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Теми оформлення ---
        const themes = {
            default: {
                name: "Основна",
                bg: "bg-stone-50",
                card: "bg-white border-stone-200",
                text: "text-stone-800",
                primary: "bg-indigo-600 hover:bg-indigo-700 text-white",
                primaryLight: "bg-indigo-50 text-indigo-700 border-indigo-200",
                accent: "text-indigo-600",
                navActive: "bg-white text-indigo-700 shadow-sm",
                navInact: "text-stone-500 hover:text-stone-800 hover:bg-stone-200/50",
                input: "bg-stone-50 border-stone-200 focus:border-indigo-500",
                badge: "bg-stone-100 text-stone-600"
            },
            frutiger: {
                name: "Frutiger Dream 🌸",
                bg: "bg-gradient-to-br from-sky-100 via-pink-50 to-blue-100",
                card: "bg-white/80 backdrop-blur-md border-sky-200 shadow-sky-100",
                text: "text-sky-900",
                primary: "bg-gradient-to-r from-sky-400 to-pink-400 hover:from-sky-500 hover:to-pink-500 text-white shadow-md shadow-pink-200",
                primaryLight: "bg-sky-50 text-sky-700 border-sky-200",
                accent: "text-pink-500",
                navActive: "bg-gradient-to-r from-sky-400 to-pink-400 text-white shadow-sm font-bold",
                navInact: "text-sky-700 hover:bg-sky-200/50",
                input: "bg-sky-50/50 border-sky-200 focus:border-pink-400",
                badge: "bg-pink-100 text-pink-600 border border-pink-200"
            }
        };

        // --- Іконки ---
        const Icon = ({ name, size = 18, className = "" }) => {
            const paths = {
                book: '<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
                pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
                brain: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>',
                settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
                columns: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="12" x2="12" y1="3" y2="21"/>',
                splitClose: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="9" x2="9" y1="3" y2="21"/><path d="m14 9-3 3 3 3"/>',
                search: '<circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/>',
                plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
                trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
                save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
                info: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>',
                check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
                users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
                logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
                user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
                palette: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.504 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>'
            };
            return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: paths[name] || '' }} />;
        };

        const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

        const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
            let reps = currentReps;
            let interval = currentInterval;
            let ease = currentEase;

            if (quality < 3) {
                reps = 0;
                interval = 1;
            } else {
                reps += 1;
                if (reps === 1) interval = 1;
                else if (reps === 2) interval = 6;
                else interval = Math.round(interval * ease);
            }

            ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
            if (ease < 1.3) ease = 1.3;

            const nextDate = new Date();
            nextDate.setDate(nextDate.getDate() + interval);
            return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
        };

        function App() {
            const [fb, setFb] = useState(null);
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [currentTheme, setCurrentTheme] = useState('default');

            const [workspaces, setWorkspaces] = useState([]);
            const [activeWorkspace, setActiveWorkspace] = useState(null);

            const [words, setWords] = useState([]);
            const [publicNotes, setPublicNotes] = useState([]);
            const [privateNotes, setPrivateNotes] = useState([]);

            const [activeTab, setActiveTab] = useState('dictionary');
            const [isSplitScreen, setIsSplitScreen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            const toastTimeoutRef = useRef(null);

            const theme = themes[currentTheme];

            const showToast = (msg) => {
                setToastMessage(msg);
                if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
                toastTimeoutRef.current = setTimeout(() => setToastMessage(null), 3000);
            };

            useEffect(() => {
                const handleReady = () => {
                    if (window.firebaseApp) {
                        setFb(window.firebaseApp);
                        const unsubscribe = window.firebaseApp.onAuthStateChanged(window.firebaseApp.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                        return () => unsubscribe();
                    }
                };
                if (window.firebaseApp) handleReady();
                window.addEventListener('firebase-ready', handleReady);
            }, []);

            const loginWithGoogle = async () => {
                if (!fb) {
                    showToast("Firebase ще завантажується.");
                    return;
                }

                const provider = new fb.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: "select_account" });

                try {
                    await fb.signInWithPopup(fb.auth, provider);
                } catch (err) {
                    console.error("Повна помилка входу:", err);
                    alert("Помилка входу: " + err.code + " - " + err.message);
                }
            };

            const logout = async () => {
                if (!fb) return;
                await fb.signOut(fb.auth);
                setUser(null);
                setActiveWorkspace(null);
            };

            useEffect(() => {
                if (!user || !fb) return;
                const wRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                const unsub = fb.onSnapshot(wRef, (snap) => {
                    const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setWorkspaces(allWs);
                    const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
                    setActiveWorkspace(myWs || null);
                }, (err) => console.error("Workspaces error:", err));
                return () => unsub();
            }, [user, fb]);

            useEffect(() => {
                if (!user || !activeWorkspace || !fb) return;

                const vRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'vocabulary');
                const unsubV = fb.onSnapshot(vRef, (snap) => {
                    setWords(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                const nRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', activeWorkspace.id, 'notes');
                const unsubN = fb.onSnapshot(nRef, (snap) => {
                    setPublicNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: true })));
                });

                const pRef = fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                const unsubP = fb.onSnapshot(pRef, (snap) => {
                    setPrivateNotes(snap.docs.map(d => ({ id: d.id, ...d.data(), isShared: false })));
                });

                return () => { unsubV(); unsubN(); unsubP(); };
            }, [user, activeWorkspace, fb]);

            if (authLoading) {
                return <div className={`flex h-screen items-center justify-center ${theme.bg} ${theme.text} text-lg font-medium`}>Завантаження EngSpace...</div>;
            }

            if (!user) {
                return (
                    <div className={`flex h-screen items-center justify-center ${theme.bg} p-4`}>
                        <div className={`${theme.card} p-8 rounded-3xl shadow-lg border max-w-md w-full text-center transition-all`}>
                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-400 to-pink-400 flex items-center justify-center text-white font-bold text-3xl shadow-lg mx-auto mb-6">✨</div>
                            <h1 className={`text-2xl font-bold ${theme.text} mb-2`}>Ласкаво просимо до EngSpace</h1>
                            <p className="text-stone-500 mb-8">Парний хмарний простір для вивчення англійської мови</p>
                            <button onClick={loginWithGoogle} className={`w-full flex items-center justify-center gap-3 ${theme.card} hover:opacity-90 ${theme.text} py-3 px-4 rounded-xl font-medium transition-all shadow-sm border`}>
                                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                                Увійти через Google
                            </button>
                        </div>
                    </div>
                );
            }

            if (!activeWorkspace) {
                return <WorkspaceSetup user={user} fb={fb} workspaces={workspaces} showToast={showToast} logout={logout} theme={theme} />;
            }

            return (
                <div className={`flex flex-col h-screen overflow-hidden ${theme.bg} transition-colors duration-300`}>
                    <header className={`flex-none flex items-center justify-between px-6 py-4 ${theme.card} border-b shadow-sm z-10`}>
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-400 to-pink-400 flex items-center justify-center text-white font-bold shadow-md">✨</div>
                            <span className={`font-semibold text-lg tracking-tight hidden sm:block ${theme.text}`}>EngSpace</span>
                        </div>

                        <nav className={`flex items-center gap-1 sm:gap-2 ${currentTheme === 'frutiger' ? 'bg-sky-100/60' : 'bg-stone-100'} p-1 rounded-xl`}>
                            <NavBtn icon={<Icon name="book" />} label="Словник" active={activeTab === 'dictionary'} onClick={() => {setActiveTab('dictionary'); setIsSplitScreen(false);}} theme={theme} />
                            <NavBtn icon={<Icon name="pen" />} label="Нотатки" active={activeTab === 'notes'} onClick={() => {setActiveTab('notes'); setIsSplitScreen(false);}} theme={theme} />
                            <NavBtn icon={<Icon name="brain" />} label="Повторення" active={activeTab === 'revision'} onClick={() => {setActiveTab('revision'); setIsSplitScreen(false);}} theme={theme} />
                            <NavBtn icon={<Icon name="settings" />} label="Налаштування" active={activeTab === 'settings'} onClick={() => {setActiveTab('settings'); setIsSplitScreen(false);}} theme={theme} />
                        </nav>

                        <div className="flex items-center gap-2">
                            {/* Перемикач тем */}
                            <button 
                                onClick={() => setCurrentTheme(currentTheme === 'default' ? 'frutiger' : 'default')} 
                                className={`flex items-center gap-1.5 px-3 py-2 rounded-lg font-medium transition-all border ${theme.card} ${theme.text} text-xs`}
                                title="Змінити тему оформлення"
                            >
                                <Icon name="palette" size={16} />
                                <span className="hidden md:inline">{currentTheme === 'default' ? 'Frutiger Theme' : 'Основна Theme'}</span>
                            </button>

                            <button onClick={() => setIsSplitScreen(!isSplitScreen)} className={`flex items-center gap-2 px-3 py-2 rounded-lg font-medium transition-colors ${isSplitScreen ? theme.primaryLight : 'hover:bg-stone-100 text-stone-600'}`}>
                                <Icon name={isSplitScreen ? "splitClose" : "columns"} />
                                <span className="hidden md:block text-sm">{isSplitScreen ? 'Закрити спліт' : 'Спліт-екран'}</span>
                            </button>
                            <button onClick={logout} className="p-2 text-stone-400 hover:text-red-600 hover:bg-stone-100 rounded-lg transition-colors" title="Вийти">
                                <Icon name="logout" size={18} />
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden p-4 sm:p-6">
                        <div className="flex flex-col lg:flex-row gap-6 h-full">
                            <div className={`flex-1 flex-col ${theme.card} rounded-2xl shadow-sm border overflow-hidden ${(activeTab === 'dictionary' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <DictionaryPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} showToast={showToast} theme={theme} />
                            </div>

                            <div className={`flex-1 flex-col ${theme.card} rounded-2xl shadow-sm border overflow-hidden ${(activeTab === 'notes' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                                <NotesPanel user={user} fb={fb} workspaceId={activeWorkspace.id} publicNotes={publicNotes} privateNotes={privateNotes} showToast={showToast} theme={theme} />
                            </div>

                            {!isSplitScreen && activeTab === 'revision' && (
                                <div className={`flex-1 flex flex-col ${theme.card} rounded-2xl shadow-sm border overflow-hidden`}>
                                    <RevisionPanel user={user} fb={fb} workspaceId={activeWorkspace.id} words={words} theme={theme} />
                                </div>
                            )}

                            {!isSplitScreen && activeTab === 'settings' && (
                                <div className={`flex-1 flex flex-col ${theme.card} rounded-2xl shadow-sm border overflow-hidden p-8 overflow-y-auto`}>
                                    <SettingsPanel user={user} fb={fb} workspace={activeWorkspace} showToast={showToast} logout={logout} theme={theme} />
                                </div>
                            )}
                        </div>
                    </main>

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 bg-stone-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 z-50">
                            <Icon name="info" className="text-indigo-400" />
                            <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick, theme }) => (
            <button onClick={onClick} className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all ${active ? theme.navActive : theme.navInact}`}>
                {icon}
                <span className="hidden md:block text-sm">{label}</span>
            </button>
        );

        function WorkspaceSetup({ user, fb, workspaces, showToast, logout, theme }) {
            const [joinCode, setJoinCode] = useState('');
            const [loading, setLoading] = useState(false);

            const handleCreate = async () => {
                setLoading(true);
                try {
                    const code = generateInviteCode();
                    const wsRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces');
                    await fb.addDoc(wsRef, {
                        inviteCode: code,
                        members: [user.uid],
                        createdAt: Date.now()
                    });
                    showToast("Простір створено!");
                } catch (err) {
                    showToast("Помилка створення простору");
                }
                setLoading(false);
            };

            const handleJoin = async (e) => {
                e.preventDefault();
                if (!joinCode.trim()) return;
                setLoading(true);
                try {
                    const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
                    if (!wsToJoin) {
                        showToast("Код не знайдено");
                    } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
                        showToast("Робочий простір вже має двох учасників");
                    } else {
                        const wsRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', wsToJoin.id);
                        const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
                        await fb.updateDoc(wsRef, { members: updatedMembers });
                        showToast("Успішно приєднано!");
                    }
                } catch (err) {
                    showToast("Помилка приєднання");
                }
                setLoading(false);
            };

            return (
                <div className={`flex h-screen items-center justify-center ${theme.bg} p-4 relative`}>
                    <button onClick={logout} className={`absolute top-6 right-6 flex items-center gap-2 ${theme.text} ${theme.card} px-4 py-2 rounded-xl border shadow-sm text-sm font-medium`}>
                        <Icon name="logout" size={16} /> Вийти ({user.email})
                    </button>
                    <div className={`${theme.card} p-8 rounded-3xl shadow-sm border max-w-md w-full`}>
                        <div className="flex justify-center mb-6">
                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-400 to-pink-400 flex items-center justify-center text-white font-bold text-3xl shadow-lg">✨</div>
                        </div>
                        <h1 className={`text-2xl font-bold text-center ${theme.text} mb-2`}>Робочий простір</h1>
                        <p className="text-center text-stone-500 mb-8 text-sm">Створіть новий простір або приєднайтеся за кодом партнера</p>

                        <button onClick={handleCreate} disabled={loading} className={`w-full flex items-center justify-center gap-2 ${theme.primary} py-3 rounded-xl font-medium transition-colors mb-6 shadow-sm disabled:opacity-50`}>
                            <Icon name="plus" size={20} /> Створити новий простір
                        </button>

                        <div className="relative flex py-4 items-center">
                            <div className="flex-grow border-t border-stone-200"></div>
                            <span className="flex-shrink-0 mx-4 text-stone-400 text-sm">або</span>
                            <div className="flex-grow border-t border-stone-200"></div>
                        </div>

                        <form onSubmit={handleJoin} className="space-y-4">
                            <div>
                                <label className={`block text-sm font-medium ${theme.text} mb-1`}>Код запрошення</label>
                                <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className={`w-full px-4 py-3 border rounded-xl outline-none uppercase text-center tracking-widest text-lg font-mono ${theme.input}`} maxLength={6} />
                            </div>
                            <button type="submit" disabled={loading || !joinCode.trim()} className="w-full bg-stone-800 hover:bg-stone-900 text-white py-3 rounded-xl font-medium transition-colors disabled:opacity-50">
                                Приєднатися
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function DictionaryPanel({ user, fb, workspaceId, words, showToast, theme }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({ en: '', uk: '', example: '' });

            const handleSave = async (e) => {
                e.preventDefault();
                if (!formData.en.trim() || !formData.uk.trim()) return;

                const newWord = {
                    ...formData,
                    addedBy: user.uid,
                    createdAt: Date.now(),
                    nextReviewDate: null,
                    interval: 0,
                    easeFactor: 2.5,
                    repetitions: 0
                };

                try {
                    const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary');
                    await fb.addDoc(colRef, newWord);
                    setFormData({ en: '', uk: '', example: '' });
                    showToast("Слово збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const handleDelete = async (id) => {
                try {
                    await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', id));
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            const filteredWords = words.filter(w => w.en.toLowerCase().includes(search.toLowerCase()) || w.uk.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className={`flex flex-col h-full ${theme.bg}`}>
                    <div className={`flex-none p-4 md:p-6 ${theme.card} border-b`}>
                        <form onSubmit={handleSave} className="space-y-3">
                            <div className="flex flex-col md:flex-row gap-3">
                                <input value={formData.en} onChange={e => setFormData({...formData, en: e.target.value})} placeholder="English word" className={`flex-1 px-4 py-2 border rounded-xl outline-none ${theme.input}`} />
                                <input value={formData.uk} onChange={e => setFormData({...formData, uk: e.target.value})} placeholder="Переклад" className={`flex-1 px-4 py-2 border rounded-xl outline-none ${theme.input}`} />
                                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className={`px-6 py-2 ${theme.primary} rounded-xl disabled:opacity-50 flex gap-2 justify-center items-center shadow-sm`}>
                                    <Icon name="save" /> <span className="hidden md:inline">Зберегти</span>
                                </button>
                            </div>
                            <input value={formData.example} onChange={e => setFormData({...formData, example: e.target.value})} placeholder="Приклад речення (необов'язково)" className={`w-full px-4 py-2 border rounded-xl outline-none text-sm ${theme.input}`} />
                        </form>
                    </div>

                    <div className="flex-1 flex flex-col min-h-0">
                        <div className={`p-4 flex-none border-b ${theme.card} sticky top-0`}>
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-stone-400"><Icon name="search" size={16} /></span>
                                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук у спільному словнику..." className={`w-full pl-9 pr-4 py-2 border rounded-xl text-sm outline-none ${theme.input}`} />
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {filteredWords.length === 0 ? (
                                <div className="text-center text-stone-400 mt-10">Словник порожній. Додайте перше слово!</div>
                            ) : (
                                filteredWords.map(word => (
                                    <div key={word.id} className={`group ${theme.card} p-4 rounded-xl border shadow-sm flex justify-between items-start gap-4`}>
                                        <div>
                                            <div className="flex items-baseline gap-3">
                                                <span className={`font-bold text-lg ${theme.text}`}>{word.en}</span>
                                                <span className={`${theme.accent} font-medium`}>{word.uk}</span>
                                            </div>
                                            {word.example && <p className="text-stone-500 italic text-sm mt-1">"{word.example}"</p>}
                                        </div>
                                        <button onClick={() => handleDelete(word.id)} className="text-stone-300 hover:text-red-500 p-2 rounded-lg hover:bg-red-50 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <Icon name="trash" size={16} />
                                        </button>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function NotesPanel({ user, fb, workspaceId, publicNotes, privateNotes, showToast, theme }) {
            const [activeNote, setActiveNote] = useState(null);
            const [isCreating, setIsCreating] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isShared, setIsShared] = useState(true);

            const allNotes = useMemo(() => [...publicNotes, ...privateNotes].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [publicNotes, privateNotes]);
            const filteredNotes = allNotes.filter(n => n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || n.content?.toLowerCase().includes(searchQuery.toLowerCase()));

            const openNote = (note) => {
                setActiveNote(note);
                setIsCreating(false);
                setTitle(note.title);
                setContent(note.content);
                setIsShared(note.isShared);
            };

            const saveNote = async () => {
                if (!title.trim() && !content.trim()) return;
                const noteData = { title: title || 'Без назви', content, updatedAt: Date.now() };

                try {
                    if (activeNote) {
                        if (activeNote.isShared !== isShared) {
                            const oldPath = activeNote.isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.deleteDoc(oldPath);

                            const newCol = isShared 
                                ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                                : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                            const newDoc = await fb.addDoc(newCol, { ...noteData, createdAt: activeNote.createdAt || Date.now() });
                            setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        } else {
                            const ref = isShared 
                                ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', activeNote.id)
                                : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', activeNote.id);
                            await fb.updateDoc(ref, noteData);
                            setActiveNote({ ...activeNote, ...noteData });
                        }
                    } else {
                        const col = isShared 
                            ? fb.collection(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes')
                            : fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes');
                        const newDoc = await fb.addDoc(col, { ...noteData, createdAt: Date.now() });
                        setActiveNote({ id: newDoc.id, ...noteData, isShared });
                        setIsCreating(false);
                    }
                    showToast("Нотатку збережено");
                } catch (err) {
                    showToast("Помилка збереження");
                }
            };

            const deleteNote = async (note) => {
                try {
                    const ref = note.isShared 
                        ? fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'notes', note.id)
                        : fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'notes', note.id);
                    await fb.deleteDoc(ref);
                    if (activeNote?.id === note.id) {
                        setActiveNote(null);
                        setIsCreating(false);
                    }
                    showToast("Видалено");
                } catch (err) {
                    showToast("Помилка видалення");
                }
            };

            return (
                <div className="flex h-full">
                    <div className={`w-full md:w-1/3 border-r flex flex-col ${theme.bg} ${(activeNote || isCreating) ? 'hidden md:flex' : 'flex'}`}>
                        <div className={`p-4 border-b ${theme.card}`}>
                            <button onClick={() => { setActiveNote(null); setTitle(''); setContent(''); setIsCreating(true); }} className={`w-full flex items-center justify-center gap-2 ${theme.card} border py-2 rounded-xl text-sm font-medium shadow-sm transition-all`}>
                                <Icon name="plus" /> Створити нотатку
                            </button>
                        </div>
                        <div className={`p-3 border-b ${theme.card}`}>
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-stone-400"><Icon name="search" size={16} /></span>
                                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className={`w-full pl-9 pr-3 py-1.5 border rounded-lg text-sm outline-none ${theme.input}`} />
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-2 space-y-1">
                            {filteredNotes.map(note => (
                                <div key={note.id} onClick={() => openNote(note)} className={`p-3 rounded-xl cursor-pointer border transition-all ${activeNote?.id === note.id ? theme.primaryLight : 'hover:bg-sky-100/30 border-transparent'}`}>
                                    <div className="flex items-center justify-between mb-1">
                                        <h4 className={`font-medium ${theme.text} truncate pr-2`}>{note.title}</h4>
                                        {note.isShared ? <span title="Спільна"><Icon name="users" size={14} className={theme.accent} /></span> : <span className={`text-xs ${theme.badge} px-1.5 py-0.5 rounded`}>Особиста</span>}
                                    </div>
                                    <p className="text-xs text-stone-500 truncate">{note.content || 'Пусто...'}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className={`w-full md:w-2/3 flex flex-col ${theme.card} ${!activeNote && !isCreating && allNotes.length > 0 ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
                        {(!activeNote && !isCreating && title === '' && content === '') ? (
                            <div className="text-center text-stone-400 flex flex-col items-center gap-3">
                                <Icon name="pen" size={48} className="opacity-20" />
                                <p>Оберіть нотатку або створіть нову</p>
                            </div>
                        ) : (
                            <>
                                <div className={`flex items-center justify-between p-4 border-b ${theme.card}`}>
                                    <div className="flex items-center gap-2">
                                        <button onClick={() => { setActiveNote(null); setIsCreating(false); }} className="md:hidden text-stone-500"><Icon name="splitClose" className="rotate-180" /></button>
                                        <div className="flex bg-stone-100 p-1 rounded-lg">
                                            <button onClick={() => setIsShared(true)} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${isShared ? 'bg-white shadow-sm text-sky-700' : 'text-stone-500'}`}>Спільна</button>
                                            <button onClick={() => setIsShared(false)} className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all ${!isShared ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500'}`}>Особиста</button>
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        {activeNote && <button onClick={() => deleteNote(activeNote)} className="p-2 text-stone-400 hover:text-red-600 rounded-lg"><Icon name="trash" size={18} /></button>}
                                        <button onClick={saveNote} className={`flex items-center gap-2 ${theme.primary} px-4 py-2 rounded-lg text-sm font-medium transition-colors`}><Icon name="save" size={16} /> Зберегти</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                                    <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Назва нотатки..." className={`text-2xl font-bold border-none outline-none mb-4 placeholder:text-stone-300 bg-transparent ${theme.text}`} />
                                    <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Почніть писати тут..." className={`flex-1 w-full resize-none border-none outline-none leading-relaxed bg-transparent ${theme.text}`} />
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        function RevisionPanel({ user, fb, workspaceId, words, theme }) {
            const [currentWord, setCurrentWord] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);

            const dueWords = useMemo(() => {
                const now = Date.now();
                return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now).sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
            }, [words]);

            useEffect(() => {
                if (dueWords.length > 0) {
                    if (!currentWord || !dueWords.find(w => w.id === currentWord.id)) {
                        setCurrentWord(dueWords[0]);
                        setShowAnswer(false);
                    }
                } else {
                    setCurrentWord(null);
                }
            }, [dueWords, currentWord]);

            const handleRating = async (quality) => {
                if (!currentWord) return;
                const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

                try {
                    const wRef = fb.doc(fb.db, 'artifacts', fb.appId, 'workspaces', workspaceId, 'vocabulary', currentWord.id);
                    await fb.updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
                    setCurrentWord(null);
