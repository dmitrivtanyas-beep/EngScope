<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EngSpace — Парний словник</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "firebase/app": "https://esm.sh/firebase@10.8.0/app",
      "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
      "firebase/firestore": "https://esm.sh/firebase@10.8.0/firestore",
      "lucide-react": "https://esm.sh/lucide-react@0.344.0"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>

  <!-- Важливо: data-type="module" і type="text/babel" -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc, addDoc } from 'firebase/firestore';
    import { 
      BookA, NotebookPen, BrainCircuit, Settings, Columns, PanelLeftClose,
      Search, Plus, Trash2, Save, Users, Lock, ChevronRight, LogOut, Info 
    } from 'lucide-react';

    // ВАШІ КЛЮЧІ FIREBASE (Замініть пустий об'єкт на ваші реальні ключі)
    const firebaseConfig = {
      // apiKey: "ВАШ_API_KEY",
      // authDomain: "ваш-проєкт.firebaseapp.com",
      // projectId: "ваш-проєкт",
      // storageBucket: "ваш-проєкт.appspot.com",
      // messagingSenderId: "123456789",
      // appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'engspace-default-id';

    const generateInviteCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();

    const calculateNextReview = (quality, currentReps = 0, currentInterval = 0, currentEase = 2.5) => {
      let reps = currentReps;
      let interval = currentInterval;
      let ease = currentEase;

      if (quality < 3) {
        reps = 0;
        interval = 1;
      } else {
        reps += 1;
        if (reps === 1) interval = 1;
        else if (reps === 2) interval = 6;
        else interval = Math.round(interval * ease);
      }

      ease = ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
      if (ease < 1.3) ease = 1.3;

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + interval);

      return { repetitions: reps, interval, easeFactor: ease, nextReviewDate: nextDate.getTime() };
    };

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [workspaces, setWorkspaces] = useState([]);
      const [activeWorkspace, setActiveWorkspace] = useState(null);
      const [words, setWords] = useState([]);
      const [publicNotes, setPublicNotes] = useState([]);
      const [privateNotes, setPrivateNotes] = useState([]);
      const [activeTab, setActiveTab] = useState('dictionary');
      const [isSplitScreen, setIsSplitScreen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        const initAuth = async () => {
          try {
            await signInAnonymously(auth);
          } catch (error) {
            console.error("Auth Error:", error);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setUser(u);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const wRef = collection(db, 'artifacts', appId, 'public', 'data', 'workspaces');
        const unsub = onSnapshot(wRef, (snap) => {
          const allWs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setWorkspaces(allWs);
          const myWs = allWs.find(ws => ws.members && ws.members.includes(user.uid));
          setActiveWorkspace(myWs || null);
        }, (err) => console.error("Workspaces fetch error:", err));
        return () => unsub();
      }, [user]);

      useEffect(() => {
        if (!user || !activeWorkspace) return;
        
        const vRef = collection(db, 'artifacts', appId, 'public', 'data', 'vocabulary');
        const unsubV = onSnapshot(vRef, (snap) => {
          const allWords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          const workspaceWords = allWords.filter(w => w.workspaceId === activeWorkspace.id);
          setWords(workspaceWords.sort((a, b) => b.createdAt - a.createdAt));
        }, (err) => console.error("Vocabulary error:", err));

        const nRef = collection(db, 'artifacts', appId, 'public', 'data', 'notes');
        const unsubN = onSnapshot(nRef, (snap) => {
          const allNotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          setPublicNotes(allNotes.filter(n => n.workspaceId === activeWorkspace.id));
        }, (err) => console.error("Public notes error:", err));

        const pRef = collection(db, 'artifacts', appId, 'users', user.uid, 'notes');
        const unsubP = onSnapshot(pRef, (snap) => {
          setPrivateNotes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        }, (err) => console.error("Private notes error:", err));

        return () => { unsubV(); unsubN(); unsubP(); };
      }, [user, activeWorkspace]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      if (authLoading) {
        return <div className="flex h-screen items-center justify-center bg-stone-50 text-stone-500">Завантаження...</div>;
      }

      if (!activeWorkspace) {
        return <WorkspaceSetup user={user} workspaces={workspaces} />;
      }

      return (
        <div className="flex flex-col h-screen bg-stone-50 text-stone-800 font-sans overflow-hidden">
          <header className="flex-none flex items-center justify-between px-6 py-4 bg-white border-b border-stone-200 shadow-sm z-10">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">E</div>
              <span className="font-semibold text-lg tracking-tight hidden sm:block">EngSpace</span>
            </div>

            <nav className="flex items-center gap-1 sm:gap-2 bg-stone-100 p-1 rounded-xl">
              <NavBtn icon={<BookA size={18}/>} label="Словник" active={activeTab === 'dictionary'} onClick={() => {setActiveTab('dictionary'); setIsSplitScreen(false);}} />
              <NavBtn icon={<NotebookPen size={18}/>} label="Нотатки" active={activeTab === 'notes'} onClick={() => {setActiveTab('notes'); setIsSplitScreen(false);}} />
              <NavBtn icon={<BrainCircuit size={18}/>} label="Повторення" active={activeTab === 'revision'} onClick={() => {setActiveTab('revision'); setIsSplitScreen(false);}} />
              <NavBtn icon={<Settings size={18}/>} label="Налаштування" active={activeTab === 'settings'} onClick={() => {setActiveTab('settings'); setIsSplitScreen(false);}} />
            </nav>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setIsSplitScreen(!isSplitScreen)}
                className={`flex items-center gap-2 px-3 py-2 rounded-lg font-medium transition-colors ${isSplitScreen ? 'bg-indigo-100 text-indigo-700' : 'hover:bg-stone-100 text-stone-600'}`}
                title="Розділений екран (Словник + Нотатки)"
              >
                {isSplitScreen ? <PanelLeftClose size={20} /> : <Columns size={20} />}
                <span className="hidden md:block text-sm">{isSplitScreen ? 'Закрити спліт' : 'Спліт-екран'}</span>
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden p-4 sm:p-6">
            <div className="flex flex-col lg:flex-row gap-6 h-full">
              <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'dictionary' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                <DictionaryPanel user={user} workspaceId={activeWorkspace.id} words={words} showToast={showToast} autoFocus={activeTab === 'dictionary' || isSplitScreen} />
              </div>

              <div className={`flex-1 flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden ${(activeTab === 'notes' || isSplitScreen) ? 'flex' : 'hidden'}`}>
                <NotesPanel user={user} workspaceId={activeWorkspace.id} publicNotes={publicNotes} privateNotes={privateNotes} showToast={showToast} />
              </div>

              {!isSplitScreen && activeTab === 'revision' && (
                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                  <RevisionPanel words={words} workspaceId={activeWorkspace.id} />
                </div>
              )}

              {!isSplitScreen && activeTab === 'settings' && (
                <div className="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden p-8">
                  <SettingsPanel user={user} workspace={activeWorkspace} />
                </div>
              )}
            </div>
          </main>

          {toastMessage && (
            <div className="fixed bottom-6 right-6 bg-stone-800 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 animate-in fade-in slide-in-from-bottom-4 z-50">
              <Info size={18} className="text-indigo-400" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const NavBtn = ({ icon, label, active, onClick }) => (
      <button onClick={onClick} className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all ${active ? 'bg-white text-indigo-700 shadow-sm font-medium' : 'text-stone-500 hover:text-stone-800 hover:bg-stone-200/50'}`}>
        {icon}
        <span className="hidden md:block text-sm">{label}</span>
      </button>
    );

    function WorkspaceSetup({ user, workspaces }) {
      const [joinCode, setJoinCode] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleCreate = async () => {
        setLoading(true);
        try {
          const code = generateInviteCode();
          const wsRef = collection(db, 'artifacts', appId, 'public', 'data', 'workspaces');
          await addDoc(wsRef, { inviteCode: code, members: [user.uid], createdAt: Date.now() });
        } catch (err) {
          setError("Помилка створення робочого простору");
        }
        setLoading(false);
      };

      const handleJoin = async (e) => {
        e.preventDefault();
        if (!joinCode.trim()) return;
        setLoading(true);
        setError('');
        try {
          const wsToJoin = workspaces.find(w => w.inviteCode.toUpperCase() === joinCode.toUpperCase().trim());
          if (!wsToJoin) {
            setError("Код не знайдено");
          } else if (wsToJoin.members.length >= 2 && !wsToJoin.members.includes(user.uid)) {
            setError("Робочий простір вже має двох учасників");
          } else {
            const wsRef = doc(db, 'artifacts', appId, 'public', 'data', 'workspaces', wsToJoin.id);
            const updatedMembers = wsToJoin.members.includes(user.uid) ? wsToJoin.members : [...wsToJoin.members, user.uid];
            await updateDoc(wsRef, { members: updatedMembers });
          }
        } catch (err) {
          setError("Помилка приєднання");
        }
        setLoading(false);
      };

      return (
        <div className="flex h-screen items-center justify-center bg-stone-50 p-4">
          <div className="bg-white p-8 rounded-3xl shadow-sm border border-stone-200 max-w-md w-full">
            <div className="flex justify-center mb-6">
              <div className="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg">E</div>
            </div>
            <h1 className="text-2xl font-bold text-center text-stone-800 mb-2">Ласкаво просимо до EngSpace</h1>
            <p className="text-center text-stone-500 mb-8">Парний простір для вивчення англійської</p>

            <button onClick={handleCreate} disabled={loading} className="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-medium transition-colors mb-6 shadow-sm">
              <Plus size={20} /> Створити новий простір
            </button>

            <div className="relative flex py-4 items-center">
              <div className="flex-grow border-t border-stone-200"></div>
              <span className="flex-shrink-0 mx-4 text-stone-400 text-sm">або</span>
              <div className="flex-grow border-t border-stone-200"></div>
            </div>

            <form onSubmit={handleJoin} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-stone-700 mb-1">Маєте код запрошення?</label>
                <input type="text" value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Введіть код" className="w-full px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none uppercase text-center tracking-widest text-lg" maxLength={6} />
              </div>
              {error && <p className="text-red-500 text-sm text-center">{error}</p>}
              <button type="submit" disabled={loading || !joinCode.trim()} className="w-full bg-stone-800 hover:bg-stone-900 text-white py-3 rounded-xl font-medium transition-colors disabled:opacity-50">
                Приєднатися
              </button>
            </form>
          </div>
        </div>
      );
    }

    function DictionaryPanel({ user, workspaceId, words, showToast, autoFocus }) {
      const [search, setSearch] = useState('');
      const [isAdvancedForm, setIsAdvancedForm] = useState(false);
      const enInputRef = useRef(null);
      const [formData, setFormData] = useState({ en: '', uk: '', example: '', pronunciation: '', pos: '', tags: '' });

      useEffect(() => {
        if (autoFocus && enInputRef.current) enInputRef.current.focus();
      }, [autoFocus]);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSave = async (e) => {
        e?.preventDefault();
        if (!formData.en.trim() || !formData.uk.trim()) return;
        if (words.some(w => w.en.toLowerCase().trim() === formData.en.toLowerCase().trim())) {
          showToast("Це слово вже є у словнику!");
          return;
        }
        const newWord = { ...formData, workspaceId, addedBy: user.uid, createdAt: Date.now(), nextReviewDate: null, interval: 0, easeFactor: 2.5, repetitions: 0 };
        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'vocabulary'), newWord);
          setFormData({ en: '', uk: '', example: '', pronunciation: '', pos: '', tags: '' });
          showToast("Слово збережено");
          enInputRef.current?.focus();
        } catch (err) {
          showToast("Помилка збереження");
        }
      };

      const handleDelete = async (id) => {
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'vocabulary', id));
          showToast("Видалено");
        } catch (err) {
          showToast("Помилка видалення");
        }
      };

      const filteredWords = words.filter(w => {
        const s = search.toLowerCase();
        return w.en.toLowerCase().includes(s) || w.uk.toLowerCase().includes(s) || (w.tags && w.tags.toLowerCase().includes(s));
      });

      return (
        <div className="flex flex-col h-full bg-stone-50">
          <div className="flex-none p-4 md:p-6 bg-white border-b border-stone-200">
            <form onSubmit={handleSave} className="space-y-4">
              <div className="flex flex-col md:flex-row gap-3">
                <input ref={enInputRef} name="en" value={formData.en} onChange={handleChange} placeholder="English word / phrase" className="flex-1 px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-medium text-lg placeholder:font-normal" autoComplete="off" />
                <input name="uk" value={formData.uk} onChange={handleChange} placeholder="Український переклад" className="flex-1 px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-medium text-lg placeholder:font-normal" autoComplete="off" />
                <button type="submit" disabled={!formData.en.trim() || !formData.uk.trim()} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 disabled:bg-stone-300 disabled:cursor-not-allowed text-white rounded-xl font-medium transition-colors shadow-sm flex items-center justify-center gap-2 shrink-0">
                  <Save size={18} /> <span className="hidden md:inline">Зберегти</span>
                </button>
              </div>
              <div className="flex items-center justify-between px-1">
                <button type="button" onClick={() => setIsAdvancedForm(!isAdvancedForm)} className="text-sm text-indigo-600 hover:text-indigo-700 font-medium flex items-center gap-1">
                  {isAdvancedForm ? 'Сховати деталі' : '+ Додати приклад, вимову...'}
                </button>
              </div>
              {isAdvancedForm && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 animate-in slide-in-from-top-2">
                  <input name="example" value={formData.example} onChange={handleChange} placeholder="Приклад речення" className="px-3 py-2 text-sm bg-stone-50 border border-stone-200 rounded-lg outline-none focus:border-indigo-400" />
                  <input name="pronunciation" value={formData.pronunciation} onChange={handleChange} placeholder="Вимова (напр. /tɛst/)" className="px-3 py-2 text-sm bg-stone-50 border border-stone-200 rounded-lg outline-none focus:border-indigo-400" />
                  <input name="pos" value={formData.pos} onChange={handleChange} placeholder="Частина мови (noun, verb...)" className="px-3 py-2 text-sm bg-stone-50 border border-stone-200 rounded-lg outline-none focus:border-indigo-400" />
                  <input name="tags" value={formData.tags} onChange={handleChange} placeholder="Теги (через кому)" className="px-3 py-2 text-sm bg-stone-50 border border-stone-200 rounded-lg outline-none focus:border-indigo-400" />
                </div>
              )}
            </form>
          </div>

          <div className="flex-1 flex flex-col min-h-0">
            <div className="p-4 flex-none border-b border-stone-200 bg-white/50 backdrop-blur-sm sticky top-0">
              <div className="relative">
                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={18} />
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Пошук слів та перекладів..." className="w-full pl-10 pr-4 py-2 bg-white border border-stone-200 rounded-xl text-sm focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400" />
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {filteredWords.length === 0 ? (
                <div className="text-center text-stone-400 mt-10">
                  {search ? 'Нічого не знайдено' : 'Словник порожній. Додайте перше слово!'}
                </div>
              ) : (
                filteredWords.map(word => (
                  <div key={word.id} className="group bg-white p-4 rounded-xl border border-stone-200 shadow-sm hover:shadow-md transition-shadow relative">
                    <div className="flex justify-between items-start gap-4">
                      <div>
                        <div className="flex items-baseline gap-3 flex-wrap">
                          <span className="font-bold text-lg text-stone-900">{word.en}</span>
                          {word.pronunciation && <span className="text-sm text-stone-400 font-mono">/{word.pronunciation}/</span>}
                          <span className="text-stone-300 hidden sm:inline">•</span>
                          <span className="text-indigo-600 font-medium">{word.uk}</span>
                        </div>
                        {word.example && <p className="text-stone-600 italic text-sm mt-2 border-l-2 border-indigo-200 pl-3 py-1">"{word.example}"</p>}
                        <div className="flex items-center gap-3 mt-3 text-xs text-stone-400">
                          {word.pos && <span className="bg-stone-100 px-2 py-0.5 rounded-md">{word.pos}</span>}
                          {word.tags && <span className="text-stone-500">#{word.tags.split(',').join(' #')}</span>}
                          <span title="Рівень вивчення">
                            Рівень: {word.easeFactor > 2.5 ? 'Легко' : word.repetitions > 0 ? 'Вивчається' : 'Нове'}
                          </span>
                        </div>
                      </div>
                      <button onClick={() => handleDelete(word.id)} className="text-stone-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-2 rounded-lg hover:bg-red-50 shrink-0" title="Видалити">
                        <Trash2 size={16} />
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function NotesPanel({ user, workspaceId, publicNotes, privateNotes, showToast }) {
      const [activeNote, setActiveNote] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [isEditing, setIsEditing] = useState(false);
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [isShared, setIsShared] = useState(true);

      const allNotes = useMemo(() => {
        return [...publicNotes, ...privateNotes].sort((a, b) => b.updatedAt - a.updatedAt);
      }, [publicNotes, privateNotes]);

      const filteredNotes = allNotes.filter(n => 
        n.title?.toLowerCase().includes(searchQuery.toLowerCase()) || 
        n.content?.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const startNewNote = () => {
        setActiveNote(null);
        setNoteTitle('');
        setNoteContent('');
        setIsShared(true);
        setIsEditing(true);
      };

      const openNote = (note) => {
        setActiveNote(note);
        setNoteTitle(note.title);
        setNoteContent(note.content);
        setIsShared(note.isShared);
        setIsEditing(true);
      };

      const saveNote = async () => {
        if (!noteTitle.trim() && !noteContent.trim()) return;
        const noteData = { title: noteTitle || 'Без назви', content: noteContent, isShared, updatedAt: Date.now() };

        try {
          if (activeNote) {
            if (activeNote.isShared !== isShared) {
              await deleteDoc(doc(db, 'artifacts', appId, activeNote.isShared ? 'public/data/notes' : `users/${user.uid}/notes`, activeNote.id));
              const coll = isShared ? collection(db, 'artifacts', appId, 'public', 'data', 'notes') : collection(db, 'artifacts', appId, 'users', user.uid, 'notes');
              const newDoc = await addDoc(coll, { ...noteData, workspaceId, createdAt: activeNote.createdAt || Date.now() });
              setActiveNote({ id: newDoc.id, ...noteData });
            } else {
              const ref = isShared 
                ? doc(db, 'artifacts', appId, 'public', 'data', 'notes', activeNote.id)
                : doc(db, 'artifacts', appId, 'users', user.uid, 'notes', activeNote.id);
              await updateDoc(ref, noteData);
              setActiveNote({ ...activeNote, ...noteData });
            }
          } else {
            const coll = isShared ? collection(db, 'artifacts', appId, 'public', 'data', 'notes') : collection(db, 'artifacts', appId, 'users', user.uid, 'notes');
            const newDoc = await addDoc(coll, { ...noteData, workspaceId, createdAt: Date.now() });
            setActiveNote({ id: newDoc.id, ...noteData });
          }
          showToast("Нотатку збережено");
        } catch (err) {
          showToast("Помилка збереження");
        }
      };

      const deleteNote = async (note) => {
        try {
          const ref = note.isShared 
            ? doc(db, 'artifacts', appId, 'public', 'data', 'notes', note.id)
            : doc(db, 'artifacts', appId, 'users', user.uid, 'notes', note.id);
          await deleteDoc(ref);
          showToast("Видалено");
          if (activeNote?.id === note.id) {
            setIsEditing(false);
            setActiveNote(null);
          }
        } catch (err) {
          showToast("Помилка видалення");
        }
      };

      return (
        <div className="flex h-full relative">
          <div className={`w-full md:w-1/3 border-r border-stone-200 flex flex-col bg-stone-50 ${isEditing ? 'hidden md:flex' : 'flex'}`}>
            <div className="p-4 border-b border-stone-200">
              <button onClick={startNewNote} className="w-full flex items-center justify-center gap-2 bg-white border border-stone-200 hover:border-indigo-400 hover:text-indigo-600 text-stone-700 py-2 rounded-xl font-medium transition-all shadow-sm">
                <Plus size={18} /> Створити нотатку
              </button>
            </div>
            
            <div className="p-3 border-b border-stone-200 bg-white">
              <div className="relative">
                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" size={16} />
                <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Пошук нотаток..." className="w-full pl-9 pr-3 py-1.5 bg-stone-50 border border-stone-200 rounded-lg text-sm focus:outline-none focus:border-indigo-400" />
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-2 space-y-1">
              {filteredNotes.map(note => (
                <div key={note.id} onClick={() => openNote(note)} className={`p-3 rounded-xl cursor-pointer group flex flex-col gap-1 ${activeNote?.id === note.id ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-stone-100 border border-transparent'}`}>
                  <div className="flex items-center justify-between">
                    <h4 className="font-medium text-stone-800 truncate pr-2">{note.title}</h4>
                    {note.isShared ? <Users size={14} className="text-indigo-400 shrink-0"/> : <Lock size={14} className="text-stone-400 shrink-0"/>}
                  </div>
                  <p className="text-xs text-stone-500 truncate">{note.content || 'Пусто...'}</p>
                </div>
              ))}
              {filteredNotes.length === 0 && <div className="text-center text-sm text-stone-400 mt-6 px-4">Немає нотаток. Створіть першу!</div>}
            </div>
          </div>

          <div className={`w-full md:w-2/3 flex flex-col bg-white ${!isEditing ? 'hidden md:flex items-center justify-center' : 'flex'}`}>
            {!isEditing ? (
              <div className="text-center text-stone-400 flex flex-col items-center gap-3">
                <NotebookPen size={48} className="opacity-20" />
                <p>Оберіть нотатку або створіть нову</p>
              </div>
            ) : (
              <>
                <div className="flex items-center justify-between p-4 border-b border-stone-100">
                  <div className="flex items-center gap-2">
                    <button onClick={() => setIsEditing(false)} className="md:hidden p-2 -ml-2 text-stone-500 hover:bg-stone-100 rounded-lg">
                      <PanelLeftClose size={20} className="rotate-180" />
                    </button>
                    <div className="flex bg-stone-100 p-1 rounded-lg">
                      <button onClick={() => setIsShared(true)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-all ${isShared ? 'bg-white shadow-sm text-indigo-700' : 'text-stone-500 hover:text-stone-700'}`}>
                        <Users size={14}/> Спільна
                      </button>
                      <button onClick={() => setIsShared(false)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-medium transition-all ${!isShared ? 'bg-white shadow-sm text-stone-800' : 'text-stone-500 hover:text-stone-700'}`}>
                        <Lock size={14}/> Особиста
                      </button>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    {activeNote && (
                      <button onClick={() => deleteNote(activeNote)} className="p-2 text-stone-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Видалити">
                        <Trash2 size={18} />
                      </button>
                    )}
                    <button onClick={saveNote} className="flex items-center gap-2 bg-stone-800 hover:bg-stone-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                      <Save size={16} /> Зберегти
                    </button>
                  </div>
                </div>

                <div className="flex-1 flex flex-col p-6 overflow-y-auto">
                  <input type="text" value={noteTitle} onChange={(e) => setNoteTitle(e.target.value)} placeholder="Назва нотатки..." className="text-2xl font-bold text-stone-900 placeholder:text-stone-300 border-none outline-none bg-transparent mb-6" />
                  <textarea value={noteContent} onChange={(e) => setNoteContent(e.target.value)} placeholder="Почніть писати тут..." className="flex-1 w-full resize-none border-none outline-none bg-transparent text-stone-700 leading-relaxed" />
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    function RevisionPanel({ words, workspaceId }) {
      const [currentWord, setCurrentWord] = useState(null);
      const [showAnswer, setShowAnswer] = useState(false);
      const [stats, setStats] = useState({ due: 0, learned: 0 });

      const now = Date.now();
      const dueWords = useMemo(() => {
        return words.filter(w => !w.nextReviewDate || w.nextReviewDate <= now)
                    .sort((a, b) => (a.nextReviewDate || 0) - (b.nextReviewDate || 0));
      }, [words, now]);

      useEffect(() => {
        setStats({ due: dueWords.length, learned: words.filter(w => w.repetitions > 2).length });
        if (dueWords.length > 0 && !currentWord) {
          setCurrentWord(dueWords[0]);
        } else if (dueWords.length === 0) {
          setCurrentWord(null);
        }
      }, [dueWords, words]);

      const handleRating = async (quality) => {
        if (!currentWord) return;
        const { repetitions, interval, easeFactor, nextReviewDate } = calculateNextReview(quality, currentWord.repetitions, currentWord.interval, currentWord.easeFactor);

        try {
          const wRef = doc(db, 'artifacts', appId, 'public', 'data', 'vocabulary', currentWord.id);
          await updateDoc(wRef, { repetitions, interval, easeFactor, nextReviewDate });
          setShowAnswer(false);
          if (dueWords.length > 1) {
            setCurrentWord(dueWords[1]);
          } else {
            setCurrentWord(null);
          }
        } catch (err) {
          console.error("Error updating word review", err);
        }
      };

      return (
        <div className="flex flex-col h-full bg-stone-50/50 relative overflow-hidden">
          <div className="p-6 flex items-center justify-between z-10">
            <h2 className="text-xl font-bold text-stone-800 flex items-center gap-2">
              <BrainCircuit className="text-indigo-600" /> Тренування
            </h2>
            <div className="flex gap-4 text-sm font-medium text-stone-600 bg-white px-4 py-2 rounded-xl shadow-sm border border-stone-100">
              <span>Слів на сьогодні: <strong className="text-indigo-600 text-base">{stats.due}</strong></span>
              <span className="border-l border-stone-200 pl-4">Добре вивчено: <strong className="text-green-600 text-base">{stats.learned}</strong></span>
            </div>
          </div>

          <div className="flex-1 flex items-center justify-center p-6 z-10">
            {!currentWord ? (
              <div className="text-center bg-white p-10 rounded-3xl shadow-sm border border-stone-200 max-w-sm w-full">
                <h3 className="text-2xl font-bold text-stone-800 mb-2">Відмінно!</h3>
                <p className="text-stone-500 mb-6">Всі слова на сьогодні повторені.</p>
              </div>
            ) : (
              <div className="w-full max-w-2xl bg-white rounded-[2rem] shadow-lg border border-stone-100 p-8 md:p-12 flex flex-col text-center min-h-[400px]">
                <div className="flex-1 flex flex-col justify-center mb-8">
                  <span className="text-sm font-semibold text-indigo-400 uppercase tracking-widest mb-4">Англійська</span>
                  <h2 className="text-5xl font-bold text-stone-900 mb-4">{currentWord.en}</h2>
                  {currentWord.pronunciation && <p className="text-stone-400 font-mono text-lg">/{currentWord.pronunciation}/</p>}
                </div>

                {!showAnswer ? (
                  <button onClick={() => setShowAnswer(true)} className="w-full py-4 bg-stone-100 hover:bg-stone-200 text-stone-800 rounded-2xl font-semibold text-lg border border-stone-200">
                    Показати переклад
                  </button>
                ) : (
                  <div>
                    <div className="border-t border-stone-100 pt-8 mb-8">
                      <span className="text-sm font-semibold text-green-500 uppercase tracking-widest mb-2 block">Переклад</span>
                      <h3 className="text-3xl font-bold text-indigo-700 mb-4">{currentWord.uk}</h3>
                      {currentWord.example && <p className="text-stone-600 italic text-lg bg-stone-50 py-3 px-4 rounded-xl">"{currentWord.example}"</p>}
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                      <button onClick={() => handleRating(0)} className="py-3 px-2 rounded-xl font-medium bg-red-100 text-red-700">Не пам'ятаю</button>
                      <button onClick={() => handleRating(3)} className="py-3 px-2 rounded-xl font-medium bg-orange-100 text-orange-700">Важко</button>
                      <button onClick={() => handleRating(4)} className="py-3 px-2 rounded-xl font-medium bg-blue-100 text-blue-700">Добре</button>
                      <button onClick={() => handleRating(5)} className="py-3 px-2 rounded-xl font-medium bg-green-100 text-green-700">Легко</button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function SettingsPanel({ user, workspace }) {
      const handleLeave = async () => {
        if(confirm("Ви впевнені, що хочете покинути цей простір?")) {
          const wsRef = doc(db, 'artifacts', appId, 'public', 'data', 'workspaces', workspace.id);
          const newMembers = workspace.members.filter(m => m !== user.uid);
          await updateDoc(wsRef, { members: newMembers });
        }
      };

      return (
        <div className="max-w-2xl mx-auto w-full">
          <h2 className="text-2xl font-bold text-stone-800 mb-8 flex items-center gap-2">
            <Settings className="text-stone-400" /> Налаштування простору
          </h2>

          <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm mb-6">
            <h3 className="text-lg font-semibold text-stone-800 mb-4 flex items-center gap-2">
              <Users className="text-indigo-500" size={20}/> Код запрошення
            </h3>
            <p className="text-stone-500 text-sm mb-4">Поділіться цим кодом з партнером, щоб він міг приєднатися.</p>
            
            <div className="flex items-center gap-4 bg-stone-50 p-4 rounded-xl border border-stone-200">
              <div className="text-3xl font-mono font-bold tracking-widest text-indigo-700 bg-white px-6 py-2 rounded-lg border border-indigo-100 shadow-sm">
                {workspace.inviteCode}
              </div>
              <div className="flex-1"></div>
              <span className="text-sm font-medium bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">
                Учасників: {workspace.members?.length || 0}/2
              </span>
            </div>
          </div>

          <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm">
            <button onClick={handleLeave} className="bg-red-50 hover:bg-red-100 text-red-600 font-medium px-6 py-3 rounded-xl border border-red-200">
              Покинути простір
            </button>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
